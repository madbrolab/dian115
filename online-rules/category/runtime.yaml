# 时长模板：利用规则的首次命中语义形成互斥时长区间。
# 有实际媒体时长时优先使用实际值，否则使用 TMDB 时长；缺失时进入兜底目录。
movie:
  "短片（40分钟内）":
    runtime: "<40"
  "中短片（40-89分钟）":
    runtime: "<90"
  "标准长片（90-149分钟）":
    runtime: "<150"
  "超长电影（150分钟起）":
    runtime: ">=150"
  "时长未知电影": {}

tv:
  "短节目（25分钟内）":
    runtime: "<25"
  "常规节目（25-59分钟）":
    runtime: "<60"
  "长节目（60-119分钟）":
    runtime: "<120"
  "超长节目（120分钟起）":
    runtime: ">=120"
  "时长未知剧集": {}
