name: Public plugin contract v3
on:
  push:
    paths: ['docs/plugin-platform/**', 'plugin-market/**', '.github/workflows/plugin-public-surface.yml']
  pull_request:
    paths: ['docs/plugin-platform/**', 'plugin-market/**', '.github/workflows/plugin-public-surface.yml']
permissions:
  contents: read
jobs:
  public-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify public source boundary
        run: node docs/plugin-platform/conformance/verify-public-surface.mjs
      - name: Verify OpenAPI and examples
        run: |
          node docs/plugin-platform/conformance/openapi-check.mjs
          node docs/plugin-platform/conformance/annotate-openapi.mjs --check
          node docs/plugin-platform/conformance/generate-reference.mjs --check
          node docs/plugin-platform/conformance/generate-sdk-types.mjs --check
          npx --yes -p typescript@5.6.3 tsc --noEmit --strict --module esnext --moduleResolution bundler --target es2022 docs/plugin-platform/conformance/sdk-types.check.ts
          node --test docs/plugin-platform/conformance/*.test.mjs
          node docs/plugin-platform/conformance/project-check.mjs docs/plugin-platform/examples/complete-plugin
      - name: Verify portable developer skill
        run: |
          node docs/plugin-platform/conformance/sync-dev-skill.mjs --check
          node docs/plugin-platform/examples/dian115-plugin-dev/scripts/init.mjs "$RUNNER_TEMP/plugin-v3-smoke" dev.ci.smoke
          node docs/plugin-platform/conformance/project-check.mjs "$RUNNER_TEMP/plugin-v3-smoke"
