name: Plugin public surface guard

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  public-surface:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public tree
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Reject main-project source and release material
        run: node docs/plugin-platform/conformance/verify-public-surface.mjs
      - name: Validate public OpenAPI contract
        run: node docs/plugin-platform/conformance/openapi-check.mjs
      - name: Validate runtime contract regression
        run: node --test docs/plugin-platform/conformance/*.test.mjs
      - name: Verify generated Host API reference
        run: node docs/plugin-platform/conformance/generate-reference.mjs --check

  plugin-sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs/plugin-platform/examples/sdk
    steps:
      - name: Checkout public tree
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: docs/plugin-platform/examples/sdk/go.mod
          cache: false
      - name: Test the public SDK without host source
        run: go test ./...

  plugin-example:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example:
          - complete-plugin
    defaults:
      run:
        working-directory: docs/plugin-platform/examples/${{ matrix.example }}
    steps:
      - name: Checkout public tree
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs/plugin-platform/examples/${{ matrix.example }}/package-lock.json
      # Checked before anything is built, so the published manifest, market
      # template, permissions, schemas and cron rules are validated as shipped.
      # The compiled module is not present here, so project-check stops before
      # the build checks; see the note below for where the runtime is verified.
      - name: Validate the published contract
        run: node ../../conformance/project-check.mjs --manifest manifest.template.json --market market-entry.template.json
      - name: Install example dependencies
        run: npm ci
      - name: Build the Vue UI
        run: npm run build:ui
      - name: Test the preview and durable invocation examples
        run: npm test
      # A complete WASM build additionally requires TinyGo and Binaryen.
      # The private host suite verifies actual WASM execution; authors can run
      # npm run release locally with the documented toolchain and signing key.
