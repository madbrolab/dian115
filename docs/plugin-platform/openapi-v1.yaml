paths:
  /api/plugin-center/v1/host-apis:
    get:
      tags:
        - Plugin Discovery
      summary: 读取当前 Host API 目录
      operationId: listPluginHostAPIs
      security:
        - AdminBearer: []
      responses:
        '200':
          description: 当前版本允许插件声明的接口
          content:
            application/json:
              schema:
                type: object
                required:
                  - apis
                properties:
                  apis:
                    type: array
                    items:
                      $ref: '#/components/schemas/HostAPIEntry'
        default:
          $ref: '#/components/responses/Problem'
  /api/115/directories:
    get:
      tags:
        - Direct Host APIs
      summary: 浏览 115 目录
      description: 读取目标账号的目录列表。
      operationId: directHost_3819c5ab636e3614
      x-dian115-category: "115"
      x-dian115-risk: read
      x-dian115-host-credentials: true
      x-dian115-in-process-only: true
      responses:
        '200':
          $ref: '#/components/responses/DirectResponse'
        '202':
          $ref: '#/components/responses/DirectResponse'
        default:
          $ref: '#/components/responses/Problem'
