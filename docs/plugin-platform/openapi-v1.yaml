components:
  securitySchemes:
    AdminBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    DirectResponse:
      description: 真实 DIAN115 Handler 的响应；字段与对应主项目接口一致。
    Problem:
      description: 调用失败
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    HostAPIEntry:
      type: object
      additionalProperties: false
      required:
        - method
        - path
        - category
        - risk
        - title
      properties:
        method:
          type: string
          enum:
            - GET
            - HEAD
            - POST
            - PUT
            - PATCH
            - DELETE
        path:
          type: string
          pattern: ^/api/
        category:
          type: string
        risk:
          type: string
          enum:
            - read
            - write
            - dangerous
        title:
          type: string
        description:
          type: string
        host_credentials:
          type: boolean
    PluginPermissions:
      type: object
      additionalProperties: false
      properties:
        apis:
          type: array
          maxItems: 128
          items:
            $ref: '#/components/schemas/APIPermission'
        network:
          type: array
          maxItems: 64
          items:
            $ref: '#/components/schemas/NetworkPermission'
        hosted_credentials:
          type: boolean
          readOnly: true
          description: 宿主根据已批准接口自动计算，插件作者不声明。
        credential_reasons:
          type: array
          readOnly: true
          items:
            type: string
    APIPermission:
      type: object
      additionalProperties: false
      required:
        - method
        - path
        - reason
      properties:
        method:
          type: string
          enum:
            - GET
            - HEAD
            - POST
            - PUT
            - PATCH
            - DELETE
        path:
          type: string
          pattern: ^/api/
        reason:
          type: string
          minLength: 1
          maxLength: 240
    NetworkPermission:
      type: object
      additionalProperties: false
      required:
        - origin
        - methods
        - proxy_mode
        - reason
      properties:
        origin:
          type: string
          format: uri
          pattern: ^https://
        methods:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum:
              - GET
              - HEAD
              - POST
              - PUT
              - PATCH
              - DELETE
        proxy_mode:
          type: string
          description: Routing preference for this origin and method. A host proxy-domain match overrides direct.
          enum:
            - system
            - direct
            - required
        reason:
          type: string
          minLength: 1
          maxLength: 240
    HostCallRequest:
      type: object
      additionalProperties: false
      required:
        - method
        - path
      properties:
        method:
          type: string
          enum:
            - GET
            - HEAD
            - POST
            - PUT
            - PATCH
            - DELETE
        path:
          type: string
          description: 已登记的 /api/... 路径，或任意公网完整 HTTPS URL。外部地址统一由宿主 Broker 访问。
          pattern: ^(?:/api/|https://)
        headers:
          type: object
          additionalProperties:
            type: string
        body_base64:
          type: string
        credential_ref:
          type: string
          pattern: '^cred_[A-Za-z0-9]+$'
          description: Installation-scoped hosted credential reference. Only valid when path is an external HTTPS URL and permissions include the hosted credential capability.
    PluginNotificationRequest:
      type: object
      additionalProperties: false
      required: [level, title, body]
      properties:
        level:
          type: string
          enum: [info, success, warning, error]
        title:
          type: string
          minLength: 1
          maxLength: 160
        body:
          type: string
          minLength: 1
          maxLength: 2000
        image_url:
          type: string
          format: uri
          pattern: ^https://
        buttons:
          type: array
          maxItems: 8
          items:
            type: array
            minItems: 1
            maxItems: 4
            items:
              type: object
              additionalProperties: false
              required: [text, url]
              properties:
                text:
                  type: string
                  minLength: 1
                  maxLength: 64
                url:
                  type: string
                  format: uri
                  pattern: ^https://
        job_ref:
          type: string
        dedupe_key:
          type: string
          maxLength: 200
    HostCallResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - headers
        - body_base64
      properties:
        status:
          type: integer
          minimum: 100
          maximum: 599
        headers:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        body_base64:
          type: string
    Problem:
      type: object
      additionalProperties: true
      properties:
        error:
          type: string
        code:
          type: string
