      host_credentials: false
    - method: DELETE
      path: /api/subscribe/pool/intents/:id
      category: subscriptions
      risk: dangerous
      title: 取消聚合订阅
      description: 取消一条聚合订阅意图。
      host_credentials: false
    - method: GET
      path: /api/pt/subscriptions
      category: subscriptions
      risk: read
      title: 查询 PT 订阅
      description: 读取 PT 订阅。
      host_credentials: false
    - method: POST
      path: /api/pt/subscriptions
      category: subscriptions
      risk: write
      title: 创建 PT 订阅
      description: 创建 PT 订阅。
      host_credentials: false
    - method: GET
      path: /api/pt/subscriptions/:id
      category: subscriptions
      risk: read
      title: 读取 PT 订阅
      description: 读取一条 PT 订阅。
      host_credentials: false
    - method: DELETE
      path: /api/pt/subscriptions/:id
      category: subscriptions
      risk: dangerous
      title: 删除 PT 订阅
      description: 删除一条 PT 订阅。
      host_credentials: false
    - method: POST
      path: /api/pt/subscriptions/:id/cancel
      category: subscriptions
      risk: dangerous
      title: 取消 PT 订阅
      description: 取消一条 PT 订阅。
      host_credentials: false
    - method: POST
      path: /api/pt/subscriptions/:id/search
      category: subscriptions
      risk: write
      title: 运行 PT 订阅搜索
      description: 立即为订阅运行一次搜索。
      host_credentials: false
    - method: GET
      path: /api/pt/subscriptions/:id/attempts
      category: subscriptions
      risk: read
      title: 查询订阅尝试
      description: 读取订阅执行记录；宿主会移除可复用的 PT 下载地址。
      host_credentials: false
    - method: GET
      path: /api/pt/subscriptions/:id/download-tasks
      category: subscriptions
      risk: read
      title: 查询订阅下载
      description: 读取订阅关联的下载任务。
      host_credentials: false
    - method: POST
      path: /api/notifications/plugin
      category: notifications
      risk: write
      title: 发送插件通知
      description: 通过宿主 Telegram 通知配置反馈插件任务结果。
      host_credentials: true
    - method: GET
      path: /api/tmdb/search
      category: tmdb
      risk: read
      title: 搜索 TMDB
      description: 搜索电影、剧集和人物。
      host_credentials: true
    - method: GET
      path: /api/tmdb/movie/:id
      category: tmdb
      risk: read
      title: 查询 TMDB 电影
      description: 读取电影详情。
      host_credentials: true
    - method: GET
      path: /api/tmdb/tv/:id
      category: tmdb
      risk: read
      title: 查询 TMDB 剧集
      description: 读取剧集详情和季度信息。
      host_credentials: true
    - method: GET
      path: /api/tmdb/trending
      category: tmdb
      risk: read
      title: 查询 TMDB 趋势
      description: 读取电影或剧集趋势。
      host_credentials: true
    - method: GET
      path: /api/tmdb/discover/movie
      category: tmdb
      risk: read
      title: 发现 TMDB 电影
      description: 按条件发现电影。
      host_credentials: true
    - method: GET
      path: /api/tmdb/discover/tv
      category: tmdb
      risk: read
      title: 发现 TMDB 剧集
      description: 按条件发现剧集。
      host_credentials: true
    - method: GET
      path: /api/tmdb/genres
      category: tmdb
      risk: read
      title: 查询 TMDB 类型
      description: 读取电影和剧集类型。
      host_credentials: true
