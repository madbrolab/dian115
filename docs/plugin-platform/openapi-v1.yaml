            available_modes:
              type: array
              uniqueItems: true
              items:
                $ref: '#/components/schemas/AccountSelectorMode'
            backup_accounts:
              type: array
              description: Populated only when account_access contains backup_select.
              items:
                $ref: '#/components/schemas/BackupAccountSummary'
        meta:
          $ref: '#/components/schemas/ResponseMeta'

    AccountSelector:
      oneOf:
        - type: object
          additionalProperties: false
          required: [mode]
