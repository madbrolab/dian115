components:
  securitySchemes:
    AdminBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Problem:
      description: 调用失败
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    HostError:
      description: 业务接口拒绝或执行失败；`host.call` 仍正常返回，插件应检查其中的 HTTP 状态码和本响应体。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HostError'
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 16-128 个可打印 ASCII 字符。同一业务写入重试时必须复用同一值。
      schema:
        type: string
        minLength: 16
        maxLength: 128
        pattern: '^[\x20-\x7E]+$'
    AccountMode:
      name: account_mode
      in: query
      required: false
      description: "main 使用主账号；backup 使用指定备用账号；backup_pool 每次读取选择一个可用备用账号。默认 main。"
      schema:
        type: string
        enum: [main, backup, backup_pool]
        default: main
    AccountID:
      name: account_id
      in: query
      required: false
      description: "account_mode=backup 时必填；main 时可指定主账号，省略则使用当前活动主账号。"
      schema:
        type: integer
        format: int64
        minimum: 1
    WatchRef:
      name: watch_ref
      in: path
      required: true
      schema:
        type: string
        pattern: '^fw_[A-Za-z0-9_-]+$'
    IntentID:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    TmdbID:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  requestBodies:
    OfflineAdd:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OfflineAddRequest'
    OfflineDelete:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OfflineDeleteRequest'
    OfflineClear:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OfflineClearRequest'
    OfflineRestart:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OfflineRestartRequest'
    ShareReceive:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ShareReceiveRequest'
    LocalMkdir:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LocalMkdirRequest'
    LocalRename:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LocalRenameRequest'
    LocalDelete:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LocalDeleteRequest'
    LocalTransfer:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LocalTransferRequest'
    LocalRecognize:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HostPathRequest'
    LocalOrganize:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LocalOrganizeRequest'
    LocalBatch:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LocalBatchRequest'
    StoragePut:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StoragePutRequest'
    WatchCreate:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WatchCreateRequest'
    WatchUpdate:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WatchUpdateRequest'
    PoolIntentCreate:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PoolIntentCreateRequest'
    PoolIntentEpisodes:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PoolIntentEpisodesRequest'
  schemas:
    HostError:
      type: object
      additionalProperties: true
      required: [error]
      properties:
        error:
          type: string
        code:
          type: string
    AccountSelector:
      type: object
      additionalProperties: false
      properties:
        mode:
          type: string
          enum: [main, backup, backup_pool]
          default: main
        id:
          type: integer
          format: int64
          minimum: 1
      description: 写操作的账号选择器。`backup` 必须给出 `id`；`backup_pool` 只允许创建离线或转存时由宿主选定账号，不允许修改已有离线任务。
    AccountSummary:
      type: object
      additionalProperties: false
      required: [mode, id]
      properties:
        mode:
          type: string
          enum: [main, backup]
        id:
          type: integer
          format: int64
        name:
          type: string
        cloud_name:
          type: string
    AccountDirectory:
      type: object
      additionalProperties: false
      required: [cid, name]
      properties:
        cid:
          type: string
        name:
          type: string
    AccountDirectoryList:
      type: object
      additionalProperties: false
      required: [dirs, cid, account]
      properties:
        dirs:
          type: array
          items:
            $ref: '#/components/schemas/AccountDirectory'
        cid:
          type: string
        account:
          $ref: '#/components/schemas/AccountSummary'
    AccountOption:
      type: object
      additionalProperties: false
      required: [mode, name]
      properties:
        mode:
          type: string
          enum: [main, backup, backup_pool]
        id:
          type: integer
          format: int64
        name:
          type: string
        user_name:
          type: string
        cloud_name:
          type: string
        is_vip:
          type: boolean
        cookie_status:
          type: string
          description: 只返回状态，不返回 Cookie。
    AccountOptions:
      type: object
      additionalProperties: false
      required: [accounts]
      properties:
        accounts:
          type: array
          items:
            $ref: '#/components/schemas/AccountOption'
    OfflineTask:
      type: object
      additionalProperties: false
      required: [info_hash, name, status, status_code, move_status, progress, size, download_rate, remaining_seconds, added_at, updated_at, file_id, target_cid, error, can_pause, can_resume, can_restart]
      properties:
        info_hash: {type: string}
        name: {type: string}
        status:
          type: string
          enum: [unknown, failed, stopped, downloading, moving, completed, move_failed]
        status_code: {type: integer}
        move_status: {type: integer}
        progress: {type: number, minimum: 0, maximum: 1}
        size: {type: integer, format: int64, minimum: 0}
        download_rate: {type: integer, format: int64, minimum: 0}
        remaining_seconds: {type: integer, format: int64, minimum: 0}
        added_at: {type: integer, format: int64, minimum: 0}
        updated_at: {type: integer, format: int64, minimum: 0}
        file_id: {type: string}
        target_cid: {type: string}
        error: {type: string}
        can_pause: {type: boolean}
        can_resume: {type: boolean}
        can_restart: {type: boolean}
    OfflineTaskList:
      type: object
      additionalProperties: false
      required: [items, page, page_size, total, page_count, account]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OfflineTask'
        page: {type: integer, minimum: 1}
        page_size: {type: integer, minimum: 1, maximum: 100}
        total: {type: integer, format: int64, minimum: 0}
        page_count: {type: integer, minimum: 1}
        account:
          $ref: '#/components/schemas/AccountSummary'
    AccountOperationResult:
      type: object
      additionalProperties: true
      required: [account]
      properties:
        account:
          $ref: '#/components/schemas/AccountSummary'
