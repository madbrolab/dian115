components:
  securitySchemes:
    AdminBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 仅插件中心管理接口使用；插件 Host Call 不携带此凭据。

  parameters:
    AccountMode:
      name: account_mode
      in: query
      description: 主账号、由宿主分配备用账号，或显式备用账号。
      schema:
        $ref: '#/components/schemas/AccountMode'
        default: main
    AccountID:
      name: account_id
      in: query
      description: account_mode=backup 时必填；其他模式忽略。
      schema: { type: integer, format: int64, minimum: 1 }
      example: 7
    DirectoryCID:
      name: cid
      in: query
      schema: { type: string, default: '0', minLength: 1 }
      example: '987654321'
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
      example: 1
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 写操作的调用方唯一键；同一语义重试复用，同一键不可改请求内容。
      schema: { type: string, minLength: 1, maxLength: 200 }
      example: plugin-action-01J6YQ8V7J
    FilePathOptional:
      name: path
      in: query
      schema: { type: string, default: / }
      example: /media/incoming
    FilePathRequired:
      name: path
      in: query
      required: true
      schema: { type: string, minLength: 1 }
      example: /media/incoming/Movie.mkv
    StorageKey:
      name: key
      in: path
      required: true
      description: 当前插件安装实例内的 KV 键。
      schema:
        type: string
        minLength: 1
        maxLength: 160
        pattern: '^[A-Za-z0-9]+(?:[._-][A-Za-z0-9]+)*$'
      example: settings.v1
    StorageIfMatch:
      name: If-Match
      in: header
      required: false
      description: 更新已有值时必须传最近一次 GET/PUT 返回的 ETag；首次创建省略。
      schema:
        type: string
        pattern: '^"pkv_[1-9][0-9]*"$'
      example: '"pkv_3"'
    WatchRef:
      name: watch_ref
      in: path
      required: true
      schema:
        type: string
        pattern: '^fw_[A-Za-z0-9_-]+$'
        maxLength: 128
      example: fw_0123456789abcdef
    NumericID:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
      example: 42
    TMDBSortBy:
      name: sort_by
      in: query
      schema: { type: string, minLength: 1, maxLength: 80 }
      example: popularity.desc
    TMDBWithGenres:
      name: with_genres
      in: query
      schema: { type: string, pattern: '^[0-9|,]+$' }
      example: '878,18'
    TMDBWithoutGenres:
      name: without_genres
      in: query
      schema: { type: string, pattern: '^[0-9|,]+$' }
    TMDBVoteAverage:
      name: vote_average.gte
      in: query
      schema: { type: number, minimum: 0, maximum: 10 }
    TMDBVoteCount:
      name: vote_count.gte
      in: query
      schema: { type: integer, minimum: 0 }
    TMDBOriginalLanguage:
      name: with_original_language
      in: query
      schema: { type: string, pattern: '^[a-z]{2,3}$' }

  requestBodies:
    OfflineAdd:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [urls]
            properties:
              account: { $ref: '#/components/schemas/AccountSelector' }
              urls:
                type: array
                minItems: 1
                maxItems: 100
                uniqueItems: true
                items: { type: string, minLength: 1, maxLength: 4096 }
              save_cid: { type: string, minLength: 1 }
          examples:
            main:
              value: { account: { mode: main }, urls: ['magnet:?xt=urn:btih:abcdef'], save_cid: '123' }
    OfflineDelete:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              account: { $ref: '#/components/schemas/AccountSelector' }
              info_hash: { type: string, minLength: 1 }
              info_hashes:
                type: array
                minItems: 1
                uniqueItems: true
                items: { type: string, minLength: 1 }
              delete_source: { type: boolean, default: false }
            anyOf:
              - required: [info_hash]
              - required: [info_hashes]
    OfflineClear:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [flag]
            properties:
              account: { $ref: '#/components/schemas/AccountSelector' }
              flag: { type: integer, minimum: 0 }
    OfflineRestart:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [info_hash]
            properties:
              account: { $ref: '#/components/schemas/AccountSelector' }
              info_hash: { type: string, minLength: 1 }
    ShareReceive:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              account: { $ref: '#/components/schemas/AccountSelector' }
              share_url: { type: string, format: uri, maxLength: 4096 }
              share_code: { type: string, minLength: 1, maxLength: 256 }
              receive_code: { type: string, maxLength: 64 }
              file_ids:
                type: array
                minItems: 1
                uniqueItems: true
                items: { type: string, minLength: 1 }
              target_cid: { type: string, minLength: 1 }
            anyOf:
              - required: [share_url]
              - required: [share_code]
    FileDelete:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [paths]
            properties:
              paths: { $ref: '#/components/schemas/NonEmptyPaths' }
    FileMkdir:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [path]
            properties:
              path: { type: string, minLength: 1 }
    FileRename:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [old_path, new_name]
            properties:
              old_path: { type: string, minLength: 1 }
              new_name: { type: string, minLength: 1, maxLength: 255 }
    FileMoveCopy:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [src_paths, dest_dir]
            properties:
              src_paths: { $ref: '#/components/schemas/NonEmptyPaths' }
              dest_dir: { type: string, minLength: 1 }
    FilePathBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [path]
            properties:
              path: { type: string, minLength: 1 }
    FileOrganize:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [path, rule_id]
            properties:
              path: { type: string, minLength: 1 }
              rule_id: { type: integer, format: int64, minimum: 1 }
    FileBatch:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [operation, paths]
            properties:
              operation: { type: string, enum: [delete, move, copy] }
              paths: { $ref: '#/components/schemas/NonEmptyPaths' }
              dest_dir: { type: string, minLength: 1 }
          example: { operation: move, paths: [/media/incoming/A.mkv], dest_dir: /media/Movies }
    PluginStoragePut:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [value]
            properties:
              value: true
          example: { value: { enabled: true, interval: 30 } }
    PluginWatchCreate:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [source, event_topic, recursive]
            properties:
              source: { $ref: '#/components/schemas/PluginWatchSource' }
              event_topic: { $ref: '#/components/schemas/EventTopic' }
              interval_seconds: { type: integer, minimum: 5, maximum: 86400, default: 30 }
              recursive: { type: boolean }
          example:
            source: { kind: host_path, path: /media/incoming }
            event_topic: files.incoming.changed
            interval_seconds: 30
            recursive: true
    PluginWatchUpdate:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            minProperties: 1
            properties:
              event_topic: { $ref: '#/components/schemas/EventTopic' }
              interval_seconds: { type: integer, minimum: 5, maximum: 86400 }
              recursive: { type: boolean }
              state: { type: string, enum: [active, paused] }
    SubscribeRecordStatus:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [status]
            properties:
              status: { type: string, minLength: 1, maxLength: 64 }
          example: { status: cancelled }
    PoolIntentCreate:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PoolIntentCreate'
    PoolIntentEpisodes:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [total_episodes]
            properties:
              total_episodes: { type: integer, minimum: 0 }
              needed_episodes: { type: string, maxLength: 4096 }
              covered_episodes: { type: string, maxLength: 4096 }
          example: { total_episodes: 7, needed_episodes: 4-7, covered_episodes: 1-3 }
    PTSubscriptionCreate:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PTSubscriptionCreate'
    PluginNotification:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [level, title, body]
            properties:
              level: { type: string, enum: [info, success, warning, error] }
              title: { type: string, minLength: 1, maxLength: 160 }
              body: { type: string, minLength: 1, maxLength: 2000 }
              job_ref:
                type: string
                maxLength: 128
                pattern: '^job_[A-Za-z0-9_-]+$'
              dedupe_key: { type: string, maxLength: 200 }
          example:
            level: success
            title: Task complete
            body: 12 items completed
            dedupe_key: task-42

  responses:
    HostAPICatalog:
      description: 当前宿主版本可声明的 METHOD + path 目录。
      content:
        application/json:
          schema: { $ref: '#/components/schemas/HostAPICatalog' }
    BusinessError:
      description: 真实业务 Handler 拒绝或执行失败。
      content:
        application/json:
          schema: { $ref: '#/components/schemas/BusinessError' }
    PluginProblem:
      description: 插件运行时接口失败。
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/PluginProblem' }
        application/json:
          schema: { $ref: '#/components/schemas/PluginProblem' }
    AccountOptions:
      description: 不含 Cookie、Token 或其他登录材料的账号选项。
      content:
        application/json:
          schema:
            type: object
            required: [accounts]
            properties:
              accounts:
                type: array
                items: { $ref: '#/components/schemas/AccountSummary' }
    AccountDirectories:
      description: 所选账号当前 CID 的目录。
      content:
        application/json:
          schema:
            type: object
            required: [dirs, cid, account]
            properties:
              dirs:
                type: array
                items: { $ref: '#/components/schemas/AccountDirectory' }
              cid: { type: string }
              account: { $ref: '#/components/schemas/AccountSummary' }
    Account115UpstreamResult:
      description: 115 业务结果；宿主追加安全账号摘要，上游业务字段按操作保留。
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Account115UpstreamResult' }
    OfflineAddResult:
      description: 离线任务已由所选账号接受。
      content:
        application/json:
          schema:
            type: object
            required: [success, accepted, save_cid, account]
            properties:
              success: { type: boolean, const: true }
              accepted: { type: integer, minimum: 0 }
              save_cid: { type: string }
              account: { $ref: '#/components/schemas/AccountSummary' }
    ShareReceiveResult:
      description: 分享内容已转存。
      content:
        application/json:
          schema:
            type: object
            required: [success, share_code, target_cid, account]
            properties:
              success: { type: boolean, const: true }
              share_code: { type: string }
              target_cid: { type: string }
              account: { $ref: '#/components/schemas/AccountSummary' }
    LocalDirectories:
      description: 可选目录列表。
      content:
        application/json:
          schema:
            type: object
            required: [current, entries]
            properties:
              current: { type: string }
              entries:
                type: array
                items: { $ref: '#/components/schemas/FileEntry' }
    LocalFiles:
      description: 本地或 CD2 挂载目录内容。
      content:
        application/json:
          schema:
            type: object
            required: [current, parent, backend, entries]
            properties:
              current: { type: string }
              parent: { type: string }
              backend: { type: string, enum: [local, cd2] }
              entries:
                type: array
                items: { $ref: '#/components/schemas/FileEntry' }
    SimpleSuccess:
      description: 同步文件操作完成。
      content:
        application/json:
          schema:
            type: object
            required: [success]
            properties:
              success: { type: boolean, const: true }
    DirectoryTree:
      description: 当前层目录树节点。
      content:
        application/json:
          schema: { $ref: '#/components/schemas/DirectoryNode' }
    CreatedPath:
      description: 目录创建完成。
      content:
        application/json:
          schema:
            type: object
            required: [success, path]
            properties:
              success: { type: boolean, const: true }
              path: { type: string }
    RenamedPath:
      description: 重命名完成。
      content:
        application/json:
          schema:
            type: object
            required: [success, new_path]
            properties:
              success: { type: boolean, const: true }
              new_path: { type: string }
    MediaRecognition:
      description: 宿主媒体识别结果；具体字段随识别器版本扩展。
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    OrganizeOptions:
      description: 路径可使用的整理规则。
      content:
        application/json:
          schema:
            type: object
            required: [path, mode, rules]
            properties:
              path: { type: string }
              mode: { type: string }
              rules:
                type: array
                items: { $ref: '#/components/schemas/OrganizeRuleOption' }
    OrganizeAccepted:
      description: 文件整理任务已提交。
      content:
        application/json:
          schema:
            type: object
            required: [message]
            properties:
              message: { type: string }
    FileBatchAccepted:
      description: 批量文件任务已入队。
      content:
        application/json:
          schema:
            type: object
            required: [task_id, status, total]
            properties:
              task_id: { type: string }
              status: { type: string }
              total: { type: integer, minimum: 0 }
    FileBatchStatus:
      description: 批量文件任务进度。
      content:
        application/json:
          schema: { $ref: '#/components/schemas/FileBatchTask' }
    CD2Browse:
      description: CD2 gRPC 浏览结果。
      content:
        application/json:
          schema:
            type: object
            required: [path, files]
            properties:
              path: { type: string }
              files:
                type: array
                items: { $ref: '#/components/schemas/FileEntry' }
    CD2Clouds:
      description: CD2 云盘根列表。
      content:
        application/json:
          schema:
            type: object
            required: [clouds]
            properties:
              clouds:
                type: array
                items:
                  type: object
                  required: [name, path]
                  properties:
                    name: { type: string }
                    path: { type: string }
    PluginStorage:
      description: 当前插件实例的 KV 值和版本。
      headers:
        ETag:
          description: 保存下一次条件更新使用的版本标签。
          schema: { type: string, pattern: '^"pkv_[1-9][0-9]*"$' }
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/PluginEnvelope'
              - type: object
                properties:
                  data: { $ref: '#/components/schemas/PluginStorageRecord' }
    PluginEmptyData:
      description: 操作成功且无额外数据。
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PluginEnvelope' }
    PluginWatchList:
      description: 当前插件实例的监控列表。
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/PluginEnvelope'
              - type: object
                properties:
                  data:
                    type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/PluginWatch' }
    PluginWatchCreated:
      description: 监控已创建。
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/PluginEnvelope'
              - type: object
                properties:
                  data: { $ref: '#/components/schemas/PluginWatch' }
    PluginWatchUpdated:
      description: 监控已更新。
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/PluginEnvelope'
              - type: object
                properties:
                  data: { $ref: '#/components/schemas/PluginWatch' }
    PluginWatchDeleted:
      description: 监控和游标已删除。
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/PluginEnvelope'
              - type: object
                properties:
                  data:
                    type: object
                    required: [watch_ref, deleted]
                    properties:
                      watch_ref: { type: string }
                      deleted: { type: boolean, const: true }
    PluginWatchRetry:
      description: 死信或待投递事件已进入重试。
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/PluginEnvelope'
              - type: object
                properties:
                  data:
                    type: object
                    required: [watch_ref, event_id, status]
                    properties:
                      watch_ref: { type: string }
                      event_id: { type: string }
                      status: { type: string, const: retrying }
    PluginWatchResync:
      description: 监控游标已清空，等待重建基线。
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/PluginEnvelope'
              - type: object
                properties:
                  data:
                    type: object
                    required: [watch_ref, status]
                    properties:
                      watch_ref: { type: string }
                      status: { type: string, const: baseline_pending }
    SubscribeRecords:
      description: 已脱敏的统一订阅记录。
      content:
        application/json:
          schema:
            type: object
            required: [code, data]
            properties:
              code: { type: string, const: ok }
              data:
                type: object
                required: [records]
                properties:
                  records:
                    type: array
                    items: { $ref: '#/components/schemas/SubscribeRecord' }
    CodeOK:
      description: 操作成功。
      content:
        application/json:
          schema:
            type: object
            required: [code]
            properties:
              code: { type: string, const: ok }
    CodeOKMessage:
      description: 操作成功并返回说明。
      content:
        application/json:
          schema:
            type: object
            required: [code, message]
            properties:
              code: { type: string, const: ok }
              message: { type: string }
    PoolIntentList:
      description: 聚合订阅和各状态计数。
      content:
        application/json:
          schema:
            type: object
            required: [code, data, counts]
            properties:
              code: { type: string, const: ok }
              data:
                type: array
                items: { $ref: '#/components/schemas/PoolIntent' }
              counts:
                type: object
                additionalProperties: { type: integer, minimum: 0 }
    PoolIntentSingle:
      description: 一条已脱敏的聚合订阅。
      content:
        application/json:
          schema:
            type: object
            required: [code, data]
            properties:
              code: { type: string, const: ok }
              data: { $ref: '#/components/schemas/PoolIntent' }
    PTSubscriptionList:
      description: 已脱敏的 PT 订阅列表。
      content:
        application/json:
          schema:
            type: object
            required: [code, data]
            properties:
              code: { type: string, const: ok }
              data:
                type: array
                items: { $ref: '#/components/schemas/PTSubscription' }
    PTSubscriptionCreated:
      description: PT 订阅已创建，并返回首次搜索是否提交。
      content:
        application/json:
          schema:
            type: object
            required: [code, data, search_submitted]
            properties:
              code: { type: string, const: ok }
              data: { $ref: '#/components/schemas/PTSubscription' }
              search_submitted: { type: boolean }
              search_message: { type: string }
    PTSubscriptionSingle:
      description: 一条已脱敏的 PT 订阅。
      content:
        application/json:
          schema:
            type: object
            required: [code, data]
            properties:
              code: { type: string, const: ok }
              data: { $ref: '#/components/schemas/PTSubscription' }
    PTSubscriptionAttempts:
      description: 已删除 download_url 并递归脱敏的执行记录。
      content:
        application/json:
          schema:
            type: object
            required: [code, data]
            properties:
              code: { type: string, const: ok }
              data:
                type: array
                items: { $ref: '#/components/schemas/PTSubscriptionAttempt' }
    PTDownloadTasks:
      description: 已脱敏的关联下载任务。
      content:
        application/json:
          schema:
            type: object
            required: [code, data]
            properties:
              code: { type: string, const: ok }
              data:
                type: array
                items: { $ref: '#/components/schemas/PTDownloadTask' }
    PluginNotificationAccepted:
      description: 通知已发送、排队、去重，或按用户配置抑制；均不需要无限重试。
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/PluginEnvelope'
              - type: object
                properties:
                  data: { $ref: '#/components/schemas/PluginNotificationResult' }
    PluginNotificationRateLimited:
      description: 当前插件安装实例超过每分钟通知上限。
      headers:
        Retry-After:
          description: 建议等待秒数。
          schema: { type: integer, minimum: 1 }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/PluginProblem' }
        application/json:
          schema: { $ref: '#/components/schemas/PluginProblem' }
    TMDBPage:
      description: 宿主缓存链路返回的 TMDB 分页结果。
      content:
        application/json:
          schema: { $ref: '#/components/schemas/TMDBPage' }
    TMDBMovie:
      description: 宿主缓存链路返回的电影详情。
      content:
        application/json:
          schema: { $ref: '#/components/schemas/TMDBMovieDetail' }
    TMDBTV:
      description: 宿主缓存链路返回的剧集详情。
      content:
        application/json:
          schema: { $ref: '#/components/schemas/TMDBTVDetail' }
    TMDBGenres:
      description: TMDB 类型列表。
      content:
        application/json:
          schema:
            type: object
            required: [genres]
            properties:
              genres:
                type: array
                items: { $ref: '#/components/schemas/TMDBGenre' }

  schemas:
    HostCallRequest:
      type: object
      additionalProperties: false
      required: [method, path]
      properties:
        method:
          type: string
          enum: [GET, HEAD, POST, PUT, PATCH, DELETE]
        path:
          type: string
          pattern: '^/api/'
          description: 已批准模板对应的实际 API 路径，可直接包含查询串。
        headers:
          type: object
          propertyNames:
            enum: [Accept, Content-Type, If-Match, If-None-Match, Idempotency-Key, X-Correlation-ID]
          additionalProperties: { type: string }
        body_base64:
          type: string
          contentEncoding: base64
          description: 解码后最多 256 KiB；GET/HEAD 通常为空。
    HostCallResponse:
      type: object
      additionalProperties: false
      required: [status, headers, body_base64]
      properties:
        status: { type: integer, minimum: 100, maximum: 599 }
        headers:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
        body_base64:
          type: string
          contentEncoding: base64
    HostAPICatalog:
      type: object
      required: [apis]
      properties:
        apis:
          type: array
          items: { $ref: '#/components/schemas/HostAPIEntry' }
    HostAPIEntry:
      type: object
      additionalProperties: false
      required: [method, path, category, risk, title]
      properties:
        method: { type: string, enum: [GET, HEAD, POST, PUT, PATCH, DELETE] }
        path: { type: string, pattern: '^/api/' }
        category: { type: string }
        risk: { type: string, enum: [read, write, dangerous] }
        title: { type: string }
        description: { type: string }
        host_credentials: { type: boolean, default: false }
    BusinessError:
      type: object
      additionalProperties: true
      required: [error]
      properties:
        error: { type: string }
        code: { type: string }
        message: { type: string }
    PluginProblem:
      type: object
      additionalProperties: true
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string }
        instance: { type: string, format: uri-reference }
        code: { type: string }
        error: { type: string }
        request_id: { type: string }
    AccountMode:
      type: string
      enum: [main, backup_pool, backup]
    AccountSelector:
      type: object
      additionalProperties: false
      required: [mode]
      properties:
        mode: { $ref: '#/components/schemas/AccountMode' }
        id: { type: integer, format: int64, minimum: 1 }
      description: mode=backup 时 id 必填；backup_pool 由宿主分配并在响应中返回实际账号。
    AccountSummary:
      type: object
      additionalProperties: false
      required: [mode, name]
      properties:
        mode: { $ref: '#/components/schemas/AccountMode' }
        id: { type: integer, format: int64, minimum: 1 }
        name: { type: string }
        user_name: { type: string }
        cloud_name: { type: string }
        is_vip: { type: boolean }
        cookie_status: { type: string }
    AccountDirectory:
      type: object
      additionalProperties: true
      required: [cid, name]
      properties:
        cid: { type: string }
        name: { type: string }
    Account115UpstreamResult:
