            pattern: '^[A-Za-z0-9](?:[A-Za-z0-9]|[._-](?=[A-Za-z0-9]))*$'
      responses:
        '200':
          description: 插件自己的持久化值；`ETag` 头与 `data.revision` 一致。
          headers:
            ETag:
              schema: {type: string, pattern: '^"pkv_[0-9]+"$'}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageValueEnvelope'
        '400':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    put:
      tags:
        - Direct Host APIs
      summary: 保存插件数据
      description: 保存当前安装实例自己的持久化数据。
      operationId: directHost_dfbbfe3fb679870b
      x-dian115-category: plugin-runtime
      x-dian115-risk: write
      x-dian115-host-credentials: false
      x-dian115-in-process-only: true
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 160
            pattern: '^[A-Za-z0-9](?:[A-Za-z0-9]|[._-](?=[A-Za-z0-9]))*$'
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: If-Match
          in: header
          required: false
          description: 更新已有值时传上一响应的 `ETag`；省略表示无条件创建或覆盖。
          schema: {type: string, pattern: '^"?pkv_[0-9]+"?$'}
      requestBody:
        $ref: '#/components/requestBodies/StoragePut'
      responses:
        '200':
          description: 保存后的值和新 revision
          headers:
            ETag:
              schema: {type: string, pattern: '^"pkv_[0-9]+"$'}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageValueEnvelope'
        '400':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
