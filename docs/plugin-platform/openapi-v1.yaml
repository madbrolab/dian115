              minimum: 1
              maximum: 4
        tone: { type: string, enum: [default, primary, info, success, warning, danger], default: default }
        icon: { type: string, minLength: 1, maxLength: 48, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' }

    PluginUITablePresentation:
