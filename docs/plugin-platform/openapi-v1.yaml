openapi: 3.1.0
info:
  title: DIAN115 Plugin Host API v2
  version: 2.0.0
  license:
    name: Contract documentation only
    identifier: NOASSERTION
  description: |
    DIAN115 插件 Host API 开发契约。宿主管理的 process 插件通过 Host Call 直接调用安装时批准的 METHOD + /api/path；宿主校验权限后分发到真实 Handler，无需连接 DIAN115 HTTP 端口。

    本文档只描述插件开发所需的直接宿主接口。
servers:
  - url: /
    description: 逻辑地址；插件在进程内调用，不自行连接本服务。
security: []
tags:
  - name: Direct Host APIs
    description: 安装时逐项批准、由 process host.call 调用的真实 DIAN115 接口。
  - name: Plugin Discovery
    description: 管理员读取当前版本可声明的 Host API 目录。
x-dian115-host-call:
  local_request: '{"method":"GET","path":"/api/tmdb/search","headers":{},"body_base64":""}'
  external_request: '{"method":"GET","path":"http://127.0.0.1:8080/items","headers":{},"body_base64":""}'
  authorization: permissions.apis validates local METHOD + path. External HTTP/HTTPS is brokered by the host, including local and LAN targets; permissions.network supplies optional per-origin/method routing preferences, and host proxy-domain rules always win.
  limits: process host.call request/response frames and decoded request/response bodies are each limited to 256 KiB; Base64 and JSON envelope overhead counts toward the frame limit.
x-dian115-host-apis:
  generated_from: internal Host API catalog
  entries:
    - method: GET
      path: /api/115/directories
      category: "115"
      risk: read
      title: 浏览 115 目录
      description: 读取目标账号的目录列表。
      host_credentials: true
    - method: GET
      path: /api/115/offline/tasks
      category: "115"
      risk: read
      title: 查询离线任务
      description: 查询目标账号的离线任务。
      host_credentials: true
    - method: GET
      path: /api/115/offline/quota
      category: "115"
      risk: read
      title: 查询离线额度
      description: 查询目标账号的离线配额。
      host_credentials: true
    - method: POST
      path: /api/115/offline/add
      category: "115"
      risk: write
      title: 创建离线任务
      description: 将磁力、ED2K 或其他离线地址添加到指定目录。
      host_credentials: true
    - method: POST
      path: /api/115/offline/delete
      category: "115"
      risk: dangerous
      title: 删除离线任务
      description: 删除目标账号中的离线任务。
      host_credentials: true
    - method: POST
      path: /api/115/offline/clear
      category: "115"
      risk: dangerous
      title: 清理离线任务
      description: 批量清理目标账号中的离线任务。
      host_credentials: true
    - method: POST
      path: /api/115/offline/restart
      category: "115"
      risk: write
      title: 重试离线任务
      description: 重新提交一个离线任务。
      host_credentials: true
    - method: GET
      path: /api/115/offline/download-path
      category: "115"
      risk: read
      title: 查询默认离线目录
      description: 查询目标账号的默认离线目录。
      host_credentials: true
    - method: POST
      path: /api/115/share/receive
      category: "115"
      risk: write
      title: 转存 115 分享
      description: 将 115 分享链接转存到目标账号的指定目录。
      host_credentials: true
    - method: GET
      path: /api/115/accounts/options
      category: "115"
      risk: read
      title: 列出可用账号
      description: 返回不含 Cookie 的主账号和备用号池选项。
      host_credentials: true
    - method: GET
      path: /api/local-dirs
      category: files
      risk: read
      title: 浏览可选目录
      description: 读取文件管理器可用目录。
      host_credentials: false
    - method: GET
      path: /api/local-files
      category: files
      risk: read
      title: 列出文件
      description: 列出本地挂载或 CD2 挂载目录中的文件。
      host_credentials: false
    - method: GET
      path: /api/local-files/tree
      category: files
      risk: read
      title: 读取目录树
      description: 读取本地挂载或 CD2 挂载目录树。
      host_credentials: false
    - method: POST
      path: /api/local-files/mkdir
      category: files
      risk: write
      title: 创建目录
      description: 在文件管理器中创建目录。
      host_credentials: false
    - method: POST
      path: /api/local-files/rename
      category: files
      risk: dangerous
      title: 重命名文件
      description: 重命名文件或目录。
      host_credentials: false
    - method: DELETE
      path: /api/local-files
      category: files
      risk: dangerous
      title: 删除文件
      description: 删除文件或目录。
      host_credentials: false
    - method: POST
      path: /api/local-files/move
      category: files
      risk: dangerous
      title: 移动文件
      description: 按宿主规则在本地挂载或 CD2 之间移动文件。
      host_credentials: false
    - method: POST
      path: /api/local-files/copy
      category: files
      risk: write
      title: 复制文件
      description: 按宿主规则在本地挂载或 CD2 之间复制文件。
      host_credentials: false
    - method: POST
      path: /api/local-files/recognize
      category: files
      risk: write
      title: 识别媒体文件
      description: 调用宿主识别能力分析文件。
      host_credentials: false
    - method: GET
      path: /api/local-files/organize-options
      category: files
      risk: read
      title: 读取整理选项
      description: 读取可用的整理目标和规则。
      host_credentials: false
    - method: POST
      path: /api/local-files/organize
      category: files
      risk: dangerous
      title: 整理文件
      description: 调用宿主文件整理能力。
      host_credentials: false
    - method: POST
      path: /api/local-files/batch
      category: files
      risk: dangerous
      title: 批量管理文件
      description: 批量复制、移动或删除文件。
      host_credentials: false
    - method: GET
      path: /api/local-files/batch-status
      category: files
      risk: read
      title: 查询文件任务
      description: 查询批量文件任务状态。
      host_credentials: false
    - method: GET
      path: /api/browse
      category: cd2
      risk: read
      title: 浏览 CD2
      description: 通过宿主已配置的 CD2 gRPC 连接浏览目录。
      host_credentials: true
    - method: GET
      path: /api/cd2/clouds
      category: cd2
      risk: read
      title: 列出 CD2 云盘
      description: 读取宿主配置中可用的 CD2 云盘名称。
      host_credentials: true
    - method: GET
      path: /api/plugin-runtime/storage/:key
      category: plugin-runtime
      risk: read
      title: 读取插件数据
      description: 读取当前安装实例自己的持久化数据。
      host_credentials: false
    - method: PUT
      path: /api/plugin-runtime/storage/:key
      category: plugin-runtime
      risk: write
      title: 保存插件数据
      description: 保存当前安装实例自己的持久化数据。
      host_credentials: false
    - method: DELETE
      path: /api/plugin-runtime/storage/:key
      category: plugin-runtime
      risk: dangerous
      title: 删除插件数据
      description: 删除当前安装实例自己的持久化数据。
      host_credentials: false
    - method: GET
      path: /api/plugin-runtime/watches
      category: plugin-runtime/watch
      risk: read
      title: 查询目录监控
      description: 读取当前插件创建的宿主目录监控任务。
      host_credentials: false
    - method: POST
      path: /api/plugin-runtime/watches
      category: plugin-runtime/watch
      risk: write
      title: 创建目录监控
      description: 由宿主持久化轮询本地、CD2 或 115 目录，并向插件投递变化事件。
      host_credentials: true
    - method: PATCH
      path: /api/plugin-runtime/watches/:watch_ref
      category: plugin-runtime/watch
      risk: write
      title: 更新目录监控
      description: 更新当前插件的监控周期、事件主题、递归或启停状态。
      host_credentials: false
    - method: DELETE
      path: /api/plugin-runtime/watches/:watch_ref
      category: plugin-runtime/watch
      risk: dangerous
      title: 删除目录监控
      description: 永久删除当前插件的一条目录监控及其游标。
      host_credentials: false
    - method: POST
      path: /api/plugin-runtime/watches/:watch_ref/retry
      category: plugin-runtime/watch
      risk: write
      title: 重试目录事件
      description: 立即重试最近待投递或进入死信的目录变化事件。
      host_credentials: true
    - method: POST
      path: /api/plugin-runtime/watches/:watch_ref/resync
      category: plugin-runtime/watch
      risk: dangerous
      title: 重建目录监控基线
      description: 清空监控游标并从当前目录状态重新建立基线。
      host_credentials: true
    - method: GET
      path: /api/subscribe/records
      category: subscriptions
      risk: read
      title: 查询订阅记录
      description: 读取宿主订阅记录。
      host_credentials: false
    - method: GET
      path: /api/subscribe/pool/intents
      category: subscriptions
      risk: read
      title: 查询聚合订阅
      description: 读取聚合订阅意图。
      host_credentials: false
    - method: POST
      path: /api/subscribe/pool/intents
      category: subscriptions
      risk: write
      title: 创建聚合订阅
      description: 创建聚合订阅意图。
      host_credentials: false
    - method: GET
      path: /api/subscribe/pool/intents/:id
      category: subscriptions
      risk: read
      title: 读取聚合订阅
      description: 读取一条聚合订阅意图。
      host_credentials: false
    - method: PATCH
      path: /api/subscribe/pool/intents/:id/episodes
      category: subscriptions
      risk: write
      title: 更新订阅集数
      description: 更新聚合订阅需要的集数。
      host_credentials: false
    - method: DELETE
      path: /api/subscribe/pool/intents/:id
      category: subscriptions
      risk: dangerous
      title: 取消聚合订阅
      description: 取消一条聚合订阅意图。
      host_credentials: false
    - method: POST
      path: /api/notifications/plugin
      category: notifications
      risk: write
      title: 发送插件通知
      description: 通过宿主 Telegram 通知配置反馈插件任务结果。
      host_credentials: true
    - method: GET
      path: /api/tmdb/search
      category: tmdb
      risk: read
      title: 搜索 TMDB
      description: 搜索电影、剧集和人物。
      host_credentials: true
    - method: GET
      path: /api/tmdb/movie/:id
      category: tmdb
      risk: read
      title: 查询 TMDB 电影
      description: 读取电影详情。
      host_credentials: true
    - method: GET
      path: /api/tmdb/tv/:id
      category: tmdb
      risk: read
      title: 查询 TMDB 剧集
      description: 读取剧集详情和季度信息。
      host_credentials: true
    - method: GET
      path: /api/tmdb/trending
      category: tmdb
      risk: read
      title: 查询 TMDB 趋势
      description: 读取电影或剧集趋势。
      host_credentials: true
    - method: GET
      path: /api/tmdb/discover/movie
      category: tmdb
      risk: read
      title: 发现 TMDB 电影
      description: 按条件发现电影。
      host_credentials: true
    - method: GET
      path: /api/tmdb/discover/tv
      category: tmdb
      risk: read
      title: 发现 TMDB 剧集
      description: 按条件发现剧集。
      host_credentials: true
    - method: GET
      path: /api/tmdb/genres
      category: tmdb
      risk: read
      title: 查询 TMDB 类型
      description: 读取电影和剧集类型。
      host_credentials: true
x-dian115-subscription-host-apis:
  description: 订阅安全接口目录；完整开放下列操作，不包含 PT Cookie、API Key、Token、passkey、私密 RSS 地址或下载器凭据。
  entries:
    - method: GET
      path: /api/subscribe/records
      category: subscriptions
      risk: read
    - method: GET
      path: /api/subscribe/pool/intents
      category: subscriptions
      risk: read
    - method: POST
      path: /api/subscribe/pool/intents
      category: subscriptions
      risk: write
    - method: GET
      path: /api/subscribe/pool/intents/:id
      category: subscriptions
      risk: read
    - method: PATCH
      path: /api/subscribe/pool/intents/:id/episodes
      category: subscriptions
      risk: write
    - method: DELETE
      path: /api/subscribe/pool/intents/:id
      category: subscriptions
      risk: dangerous
paths:
  /api/plugin-center/v1/imports/inspect:
    post:
      tags:
        - Plugin Management
      summary: 检查本地插件包
      description: 上传 `.d115p` 并在安装前执行完整包校验。返回短期、单次使用的导入令牌，不返回服务器文件路径。
      operationId: inspectLocalPluginImport
      security:
        - AdminBearer: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [package]
              properties:
                package:
                  type: string
                  format: binary
                  description: 完整的 `.d115p` ZIP 包，最大 32 MiB。
      responses:
        '200':
          description: 包检查通过，等待管理员确认权限
          content:
            application/json:
              schema:
                type: object
                required: [import_token, expires_at, file_name, plugin]
                properties:
                  import_token:
                    type: string
                    format: uuid
                  expires_at:
                    type: string
                    format: date-time
                  file_name:
                    type: string
                  plugin:
                    type: object
                    description: 与市场安装确认对话框相同的权限、运行时和 SHA-256 快照。
        '400':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /api/plugin-center/v1/imports/{token}/install:
    post:
      tags:
        - Plugin Management
      summary: 安装已检查的本地插件
      description: 使用检查阶段返回的单次令牌安装本地插件。宿主会重新校验包 SHA-256、权限同意摘要和完整包内容。
      operationId: installLocalPluginImport
      security:
        - AdminBearer: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [permissions_accepted, consent_digest]
              properties:
                permissions_accepted:
                  type: boolean
                  const: true
                process_risk_accepted:
                  type: boolean
                consent_digest:
                  type: string
                  pattern: '^[0-9a-f]{64}$'
                enable:
                  type: boolean
                  default: true
      responses:
        '202':
          description: 已创建异步插件安装操作
          content:
            application/json:
              schema:
                type: object
                required: [operation]
                properties:
                  operation:
                    type: object
                    description: 通过插件操作查询接口轮询状态。
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /api/plugin-center/v1/imports/{token}:
    delete:
      tags:
        - Plugin Management
      summary: 取消本地插件导入
      description: 删除尚未提交安装的本地导入暂存包。
      operationId: discardLocalPluginImport
      security:
        - AdminBearer: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 暂存包已删除
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /api/plugin-center/v1/host-apis:
    get:
      tags:
        - Plugin Discovery
      summary: 读取当前 Host API 目录
      operationId: listPluginHostAPIs
      security:
        - AdminBearer: []
      responses:
        '200':
          description: 当前版本允许插件声明的接口
          content:
            application/json:
              schema:
                type: object
                required:
                  - apis
                properties:
                  apis:
                    type: array
                    items:
                      $ref: '#/components/schemas/HostAPIEntry'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /api/115/directories:
    get:
      tags:
        - Direct Host APIs
      summary: 浏览 115 目录
      description: 读取目标账号的目录列表。
      operationId: directHost_3819c5ab636e3614
      x-dian115-category: "115"
      x-dian115-risk: read
      x-dian115-host-credentials: true
      x-dian115-in-process-only: true
      parameters:
        - $ref: '#/components/parameters/AccountMode'
        - $ref: '#/components/parameters/AccountID'
        - name: cid
          in: query
          required: false
          schema: {type: string, default: '0'}
      responses:
        '200':
          description: 目录列表和实际使用的账号摘要
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDirectoryList'
        '400':
          $ref: '#/components/responses/HostError'
        default:
          $ref: '#/components/responses/HostError'
  /api/115/offline/tasks:
    get:
      tags:
        - Direct Host APIs
      summary: 查询离线任务
      description: 查询目标账号的离线任务。
      operationId: directHost_0136d6aee6ff8719
      x-dian115-category: "115"
      x-dian115-risk: read
      x-dian115-host-credentials: true
      x-dian115-in-process-only: true
      parameters:
        - $ref: '#/components/parameters/AccountMode'
        - $ref: '#/components/parameters/AccountID'
        - name: page
          in: query
          schema: {type: integer, minimum: 1, default: 1}
        - name: page_size
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 30}
        - name: status
          in: query
          description: 推荐的状态过滤器；提供后忽略 `stat`。
          schema: {type: string, enum: [all, failed, completed, downloading]}
        - name: stat
          in: query
          description: 兼容 115 原始状态码的过滤器。
          schema: {type: string}
      responses:
        '200':
          description: 已规范化、可跨 115 客户端版本使用的任务列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfflineTaskList'
        '400':
          $ref: '#/components/responses/HostError'
        default:
          $ref: '#/components/responses/HostError'
  /api/115/offline/quota:
    get:
      tags:
        - Direct Host APIs
      summary: 查询离线额度
      description: 查询目标账号的离线配额。
      operationId: directHost_29aba58ff88033b1
      x-dian115-category: "115"
      x-dian115-risk: read
      x-dian115-host-credentials: true
      x-dian115-in-process-only: true
      parameters:
        - $ref: '#/components/parameters/AccountMode'
        - $ref: '#/components/parameters/AccountID'
      responses:
        '200':
          description: 离线额度和实际使用的账号摘要
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountOperationResult'
        '400':
          $ref: '#/components/responses/HostError'
        default:
          $ref: '#/components/responses/HostError'
  /api/115/offline/add:
    post:
      tags:
        - Direct Host APIs
      summary: 创建离线任务
      description: 将磁力、ED2K 或其他离线地址添加到指定目录。
      operationId: directHost_cb7c330acf71e79a
      x-dian115-category: "115"
      x-dian115-risk: write
      x-dian115-host-credentials: true
      x-dian115-in-process-only: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/OfflineAdd'
      responses:
        '200':
          description: 离线地址已提交
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfflineAddResult'
        '400':
          $ref: '#/components/responses/HostError'
        default:
          $ref: '#/components/responses/HostError'
  /api/115/offline/delete:
    post:
      tags:
        - Direct Host APIs
      summary: 删除离线任务
      description: 删除目标账号中的离线任务。
      operationId: directHost_fac11dbb0da39c35
      x-dian115-category: "115"
      x-dian115-risk: dangerous
      x-dian115-host-credentials: true
      x-dian115-in-process-only: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/OfflineDelete'
      responses:
        '200':
          description: 删除结果和实际使用的账号摘要
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountOperationResult'
        '400':
          $ref: '#/components/responses/HostError'
        default:
          $ref: '#/components/responses/HostError'
  /api/115/offline/clear:
    post:
      tags:
        - Direct Host APIs
      summary: 清理离线任务
      description: 批量清理目标账号中的离线任务。
      operationId: directHost_7b6d401f69cffd71
      x-dian115-category: "115"
      x-dian115-risk: dangerous
