openapi: 3.1.0
info:
  title: DIAN115 Plugin Host API v2
  version: 2.0.0
  description: |
    DIAN115 插件 Host API 开发契约。宿主管理的 process 插件通过 Host Call 直接调用安装时批准的 METHOD + /api/path；宿主校验权限后分发到真实 Handler，无需连接 DIAN115 HTTP 端口。

    本文档只描述插件开发所需的直接宿主接口。
servers:
  - url: /
    description: 逻辑地址；插件在进程内调用，不自行连接本服务。
tags:
  - name: Direct Host APIs
    description: 安装时逐项批准、由 process host.call 调用的真实 DIAN115 接口。
  - name: Plugin Discovery
    description: 管理员读取当前版本可声明的 Host API 目录。
x-dian115-host-call:
  local_request: '{"method":"GET","path":"/api/tmdb/search","headers":{},"body_base64":""}'
  external_request: '{"method":"GET","path":"https://example.com/items","headers":{},"body_base64":"","credential_ref":"cred_..."}'
  authorization: permissions.apis validates local METHOD + path. External public HTTPS is brokered by the host; permissions.network supplies optional per-origin/method routing preferences, and host proxy-domain rules always win.
  limits: process host.call request/response frames and decoded request/response bodies are each limited to 256 KiB; Base64 and JSON envelope overhead counts toward the frame limit.
x-dian115-host-apis:
  generated_from: internal Host API catalog
  entries:
    - method: GET
      path: /api/115/directories
      category: "115"
      risk: read
      title: 浏览 115 目录
      description: 读取目标账号的目录列表。
      host_credentials: true
    - method: GET
      path: /api/115/offline/tasks
      category: "115"
      risk: read
      title: 查询离线任务
      description: 查询目标账号的离线任务。
      host_credentials: true
    - method: GET
      path: /api/115/offline/quota
      category: "115"
      risk: read
      title: 查询离线额度
      description: 查询目标账号的离线配额。
      host_credentials: true
    - method: POST
      path: /api/115/offline/add
      category: "115"
      risk: write
      title: 创建离线任务
      description: 将磁力、ED2K 或其他离线地址添加到指定目录。
      host_credentials: true
    - method: POST
      path: /api/115/offline/delete
      category: "115"
      risk: dangerous
      title: 删除离线任务
      description: 删除目标账号中的离线任务。
      host_credentials: true
    - method: POST
      path: /api/115/offline/clear
      category: "115"
      risk: dangerous
      title: 清理离线任务
      description: 批量清理目标账号中的离线任务。
      host_credentials: true
    - method: POST
      path: /api/115/offline/restart
      category: "115"
      risk: write
      title: 重试离线任务
      description: 重新提交一个离线任务。
      host_credentials: true
    - method: GET
      path: /api/115/offline/download-path
      category: "115"
      risk: read
      title: 查询默认离线目录
      description: 查询目标账号的默认离线目录。
      host_credentials: true
    - method: POST
      path: /api/115/share/receive
      category: "115"
      risk: write
      title: 转存 115 分享
      description: 将 115 分享链接转存到目标账号的指定目录。
      host_credentials: true
    - method: GET
      path: /api/115/accounts/options
      category: "115"
      risk: read
      title: 列出可用账号
      description: 返回不含 Cookie 的主账号和备用号池选项。
      host_credentials: true
    - method: GET
      path: /api/local-dirs
      category: files
      risk: read
      title: 浏览可选目录
      description: 读取文件管理器可用目录。
      host_credentials: false
    - method: GET
      path: /api/local-files
      category: files
      risk: read
      title: 列出文件
      description: 列出本地挂载或 CD2 挂载目录中的文件。
      host_credentials: false
    - method: GET
      path: /api/local-files/tree
      category: files
      risk: read
      title: 读取目录树
      description: 读取本地挂载或 CD2 挂载目录树。
      host_credentials: false
    - method: POST
      path: /api/local-files/mkdir
      category: files
      risk: write
      title: 创建目录
      description: 在文件管理器中创建目录。
      host_credentials: false
    - method: POST
      path: /api/local-files/rename
      category: files
      risk: dangerous
      title: 重命名文件
      description: 重命名文件或目录。
      host_credentials: false
    - method: DELETE
      path: /api/local-files
      category: files
      risk: dangerous
      title: 删除文件
      description: 删除文件或目录。
      host_credentials: false
    - method: POST
      path: /api/local-files/move
      category: files
      risk: dangerous
      title: 移动文件
      description: 按宿主规则在本地挂载或 CD2 之间移动文件。
      host_credentials: false
    - method: POST
      path: /api/local-files/copy
      category: files
      risk: write
      title: 复制文件
      description: 按宿主规则在本地挂载或 CD2 之间复制文件。
      host_credentials: false
    - method: POST
      path: /api/local-files/recognize
      category: files
      risk: write
      title: 识别媒体文件
      description: 调用宿主识别能力分析文件。
      host_credentials: false
    - method: GET
      path: /api/local-files/organize-options
      category: files
      risk: read
      title: 读取整理选项
      description: 读取可用的整理目标和规则。
      host_credentials: false
    - method: POST
      path: /api/local-files/organize
      category: files
      risk: dangerous
      title: 整理文件
      description: 调用宿主文件整理能力。
      host_credentials: false
    - method: POST
      path: /api/local-files/batch
      category: files
      risk: dangerous
      title: 批量管理文件
      description: 批量复制、移动或删除文件。
      host_credentials: false
    - method: GET
      path: /api/local-files/batch-status
      category: files
      risk: read
      title: 查询文件任务
      description: 查询批量文件任务状态。
      host_credentials: false
    - method: GET
      path: /api/browse
      category: cd2
      risk: read
      title: 浏览 CD2
      description: 通过宿主已配置的 CD2 gRPC 连接浏览目录。
      host_credentials: true
    - method: GET
      path: /api/cd2/clouds
      category: cd2
      risk: read
      title: 列出 CD2 云盘
      description: 读取宿主配置中可用的 CD2 云盘名称。
      host_credentials: true
    - method: GET
      path: /api/plugin-runtime/storage/:key
      category: plugin-runtime
      risk: read
      title: 读取插件数据
      description: 读取当前安装实例自己的持久化数据。
      host_credentials: false
    - method: PUT
      path: /api/plugin-runtime/storage/:key
      category: plugin-runtime
      risk: write
      title: 保存插件数据
      description: 保存当前安装实例自己的持久化数据。
      host_credentials: false
    - method: DELETE
      path: /api/plugin-runtime/storage/:key
      category: plugin-runtime
      risk: dangerous
      title: 删除插件数据
      description: 删除当前安装实例自己的持久化数据。
      host_credentials: false
    - method: GET
      path: /api/plugin-runtime/watches
      category: plugin-runtime/watch
      risk: read
      title: 查询目录监控
      description: 读取当前插件创建的宿主目录监控任务。
      host_credentials: false
    - method: POST
      path: /api/plugin-runtime/watches
      category: plugin-runtime/watch
      risk: write
      title: 创建目录监控
      description: 由宿主持久化轮询本地、CD2 或 115 目录，并向插件投递变化事件。
      host_credentials: true
    - method: PATCH
      path: /api/plugin-runtime/watches/:watch_ref
      category: plugin-runtime/watch
      risk: write
      title: 更新目录监控
      description: 更新当前插件的监控周期、事件主题、递归或启停状态。
      host_credentials: false
    - method: DELETE
      path: /api/plugin-runtime/watches/:watch_ref
      category: plugin-runtime/watch
      risk: dangerous
      title: 删除目录监控
      description: 永久删除当前插件的一条目录监控及其游标。
      host_credentials: false
    - method: POST
      path: /api/plugin-runtime/watches/:watch_ref/retry
      category: plugin-runtime/watch
      risk: write
      title: 重试目录事件
      description: 立即重试最近待投递或进入死信的目录变化事件。
      host_credentials: true
    - method: POST
      path: /api/plugin-runtime/watches/:watch_ref/resync
      category: plugin-runtime/watch
      risk: dangerous
      title: 重建目录监控基线
      description: 清空监控游标并从当前目录状态重新建立基线。
      host_credentials: true
    - method: GET
      path: /api/subscribe/records
      category: subscriptions
      risk: read
      title: 查询订阅记录
      description: 读取宿主订阅记录。
      host_credentials: false
    - method: DELETE
      path: /api/subscribe/records/:id
      category: subscriptions
      risk: dangerous
      title: 删除订阅记录
      description: 删除一条订阅记录。
      host_credentials: false
    - method: PUT
      path: /api/subscribe/records/:id/status
      category: subscriptions
      risk: write
      title: 更新订阅状态
      description: 按主项目接口语义启用、停用或更新订阅状态。
      host_credentials: false
    - method: GET
      path: /api/subscribe/pool/intents
      category: subscriptions
      risk: read
      title: 查询聚合订阅
      description: 读取聚合订阅意图。
      host_credentials: false
    - method: POST
      path: /api/subscribe/pool/intents
      category: subscriptions
      risk: write
      title: 创建聚合订阅
      description: 创建聚合订阅意图。
      host_credentials: false
    - method: GET
      path: /api/subscribe/pool/intents/:id
      category: subscriptions
      risk: read
      title: 读取聚合订阅
      description: 读取一条聚合订阅意图。
      host_credentials: false
    - method: PATCH
      path: /api/subscribe/pool/intents/:id/episodes
      category: subscriptions
      risk: write
      title: 更新订阅集数
