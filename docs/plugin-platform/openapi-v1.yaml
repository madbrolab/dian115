          schema:
            type: string
            pattern: '^"[A-Za-z0-9]+(?:[._-][A-Za-z0-9]+)*"$'
      responses:
        '200':
          description: State envelope returned by the in-process WASM module
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginRuntimeStateEnvelope'
        '304':
          description: State is unchanged for the supplied ETag
        '404':
          $ref: '#/components/responses/ManagementError'
        '409':
          $ref: '#/components/responses/ManagementError'
        '502':
          $ref: '#/components/responses/ManagementError'
        default:
          $ref: '#/components/responses/ManagementError'

  /api/plugin-center/v1/installations/{installation_id}/runtime/actions/{action}:
    servers:
      - url: /
    parameters:
      - $ref: '#/components/parameters/InstallationIdPath'
      - name: action
        in: path
        required: true
        schema:
          type: string
          pattern: '^[A-Za-z0-9]+(?:[._-][A-Za-z0-9]+)*$'
    post:
      tags: [Plugin Center]
      summary: Invoke one action declared by the installed UI schema
      operationId: invokePluginRuntimeAction
      security:
        - AdminBearer: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PluginRuntimeActionRequest'
      responses:
        '200':
          description: Action result, including replay information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginRuntimeInvocationResponse'
        '400':
          $ref: '#/components/responses/ManagementError'
        '404':
          $ref: '#/components/responses/ManagementError'
        '409':
          $ref: '#/components/responses/ManagementError'
        '502':
          $ref: '#/components/responses/ManagementError'
        default:
          $ref: '#/components/responses/ManagementError'

  /api/plugin-center/v1/installations/{installation_id}/runtime/jobs/{job}/trigger:
    servers:
      - url: /
    parameters:
      - $ref: '#/components/parameters/InstallationIdPath'
      - name: job
        in: path
        required: true
        schema:
          type: string
          pattern: '^[A-Za-z0-9]+(?:[._-][A-Za-z0-9]+)*$'
    post:
      tags: [Plugin Center]
      summary: Manually trigger one manifest-declared scheduled job
      operationId: triggerPluginRuntimeJob
      security:
        - AdminBearer: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PluginRuntimeJobTriggerRequest'
      responses:
        '200':
          description: In-process job invocation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginRuntimeInvocationResponse'
        '400':
          $ref: '#/components/responses/ManagementError'
        '404':
          $ref: '#/components/responses/ManagementError'
        '409':
          $ref: '#/components/responses/ManagementError'
        '502':
          $ref: '#/components/responses/ManagementError'
        default:
          $ref: '#/components/responses/ManagementError'

  /api/plugin-center/v1/installations/{installation_id}/runtime/events:
    servers:
      - url: /
    parameters:
      - $ref: '#/components/parameters/InstallationIdPath'
    post:
      tags: [Plugin Center]
      summary: Deliver one manifest-declared event to the local WASM runtime
      operationId: sendPluginRuntimeEvent
      security:
        - AdminBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PluginRuntimeEventRequest'
      responses:
        '200':
          description: In-process event delivery result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginRuntimeInvocationResponse'
        '400':
          $ref: '#/components/responses/ManagementError'
        '404':
          $ref: '#/components/responses/ManagementError'
        '409':
          $ref: '#/components/responses/ManagementError'
        '502':
          $ref: '#/components/responses/ManagementError'
        default:
          $ref: '#/components/responses/ManagementError'

  /api/plugin-center/v1/installations/{installation_id}/logs:
    servers:
      - url: /
    parameters:
      - $ref: '#/components/parameters/InstallationIdPath'
    get:
      tags: [Plugin Center]
      summary: List logs owned by one plugin installation
      operationId: listPluginLogs
      security:
        - AdminBearer: []
      parameters:
        - name: level
          in: query
          required: false
          schema:
            type: string
            enum: [debug, info, warning, error]
        - name: before_id
          in: query
          required: false
          schema: { type: integer, format: int64, minimum: 1 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
      responses:
        '200':
          description: Installation-scoped bounded logs and usage
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PluginLogListResponse' }
        '404': { $ref: '#/components/responses/ManagementError' }
        default: { $ref: '#/components/responses/ManagementError' }
    delete:
      tags: [Plugin Center]
      summary: Delete all logs owned by one plugin installation
      operationId: clearPluginLogs
      security:
        - AdminBearer: []
      responses:
        '200':
          description: Number of deleted records
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                properties:
                  deleted: { type: integer, minimum: 0 }
        '404': { $ref: '#/components/responses/ManagementError' }
        default: { $ref: '#/components/responses/ManagementError' }

  /api/plugin-center/v1/installations/{installation_id}/secret-bindings:
    servers:
      - url: /
    parameters:
      - $ref: '#/components/parameters/InstallationIdPath'
    get:
      tags: [Plugin Center]
      summary: List non-secret projections of installation-scoped credential bindings
      operationId: listPluginSecretBindings
      security:
        - AdminBearer: []
      responses:
        '200':
          description: Credential binding projections; plaintext values are never returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginSecretBindingListResponse'
        '403':
          $ref: '#/components/responses/ManagementError'
        '404':
          $ref: '#/components/responses/ManagementError'
        default:
          $ref: '#/components/responses/ManagementError'
    post:
      tags: [Plugin Center]
      summary: Create an encrypted installation-scoped credential binding
      operationId: createPluginSecretBinding
      security:
        - AdminBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PluginSecretBindingCreateRequest'
      responses:
        '201':
          description: Created binding projection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginSecretBindingResponse'
        '400':
          $ref: '#/components/responses/ManagementError'
        '403':
          $ref: '#/components/responses/ManagementError'
        '404':
          $ref: '#/components/responses/ManagementError'
        '409':
          $ref: '#/components/responses/ManagementError'
        default:
          $ref: '#/components/responses/ManagementError'

  /api/plugin-center/v1/installations/{installation_id}/secret-bindings/{credential_ref}:
    servers:
      - url: /
    parameters:
      - $ref: '#/components/parameters/InstallationIdPath'
      - name: credential_ref
        in: path
        required: true
        schema:
          type: string
          pattern: '^cred_[A-Za-z0-9_-]+$'
    delete:
      tags: [Plugin Center]
      summary: Delete an installation-scoped credential binding
      operationId: deletePluginSecretBinding
      security:
        - AdminBearer: []
      responses:
        '200':
          description: Binding deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagementSuccessResponse'
        '403':
          $ref: '#/components/responses/ManagementError'
        '404':
          $ref: '#/components/responses/ManagementError'
        default:
          $ref: '#/components/responses/ManagementError'

  /api/plugin-center/v1/operations:
    servers:
      - url: /
    get:
      tags: [Plugin Center]
      summary: List recent persistent plugin-center operations
      operationId: listPluginOperations
      security:
        - AdminBearer: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: Recent operations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginOperationListResponse'
        '401':
          $ref: '#/components/responses/ManagementError'
        default:
          $ref: '#/components/responses/ManagementError'

  /api/plugin-center/v1/operations/{operation_id}:
    servers:
      - url: /
    parameters:
      - $ref: '#/components/parameters/OperationIdPath'
    get:
      tags: [Plugin Center]
      summary: Get one plugin-center operation and its decoded result when present
      operationId: getPluginOperation
      security:
        - AdminBearer: []
      responses:
        '200':
          description: Operation state and optional result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginOperationDetailResponse'
        '404':
          $ref: '#/components/responses/ManagementError'
        default:
          $ref: '#/components/responses/ManagementError'

components:
  securitySchemes:
    AdminBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Existing DIAN115 administrator token used by the same-origin management UI.

  headers:
    ETag:
      description: Quoted opaque revision token for optimistic concurrency.
      schema:
        $ref: '#/components/schemas/EntityTag'
    RequestId:
      description: Host-generated request identifier.
      schema:
        type: string

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
        pattern: '^[A-Za-z0-9._:-]+$'
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 128
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        $ref: '#/components/schemas/EntityTag'
      description: Quoted opaque entity-tag previously returned in ETag.
    OptionalIfMatch:
      name: If-Match
      in: header
      required: false
      schema:
        $ref: '#/components/schemas/EntityTag'
      description: Optional quoted opaque entity-tag previously returned in ETag.
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        maxLength: 500
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    AccountSelectionRefQuery:
      name: account_selection_ref
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/AccountSelectionRef'
      description: Required 115 account context created by POST /accounts/115/selections.
    OptionalAccountSelectionRefQuery:
      name: account_selection_ref
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/AccountSelectionRef'
      description: Required only when listing 115 account roots; omit for local and CD2 mount roots.
    EntryRefPath:
      name: entry_ref
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/EntryRef'
    PreviewRefPath:
      name: preview_ref
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/PreviewRef'
    SubscriptionRefPath:
      name: subscription_ref
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/SubscriptionRef'
    JobRefPath:
      name: job_ref
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/JobRef'
    StorageKeyPath:
      name: key
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 160
        pattern: '^[A-Za-z0-9]+(?:[._-][A-Za-z0-9]+)*$'
    KVKeyPath:
      name: key
      in: path
      required: true
      allowReserved: true
      description: Installation-scoped KV key. The Host API accepts portable slash-separated keys; `..`, leading/trailing slash and control characters are rejected.
      schema:
        type: string
        minLength: 1
        maxLength: 160
        pattern: '^(?!.*\.\.)[^/?#\x00-\x20]+$'
    RepositoryIdPath:
      name: repository_id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    InstallationIdPath:
      name: installation_id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    OperationIdPath:
      name: operation_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128

  responses:
    Problem:
      description: Request failed
      headers:
        X-Request-ID:
          schema:
            type: string
        Retry-After:
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RangeNotSatisfiable:
      description: The requested byte range is invalid or outside the current representation.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Content-Range:
          description: Unsatisfied range with the current complete length.
          schema:
            type: string
            pattern: '^bytes \*/[0-9]+$'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/RangeNotSatisfiableProblem'
    ManagementError:
      description: Plugin-center management request failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ManagementError'

  schemas:
    ManagementLocalTime:
      type: string
      pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2}$'
      description: Shanghai local time returned by the existing administrator API.

    ManagementError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string

    ManagementSuccessResponse:
      type: object
      additionalProperties: false
      required: [success]
      properties:
        success:
          type: boolean

    PluginCapabilityDisclosure:
      type: object
      additionalProperties: false
      required: [capability, reason]
      properties:
        capability:
          $ref: '#/components/schemas/CapabilityName'
        reason:
          type: string
          minLength: 1
          maxLength: 240

    ConsentDigest:
      type: string
      pattern: '^[0-9a-f]{64}$'
      description: |
        SHA-256 snapshot digest returned by the current catalog response. The
        install request must echo it unchanged together with permissions_accepted=true.

    PluginRepository:
      type: object
      additionalProperties: false
      required: [id, name, repository_url, index_url, official, enabled, created_at, updated_at]
      properties:
        id: { type: integer, minimum: 1 }
        name: { type: string, minLength: 1, maxLength: 120 }
        repository_url: { type: string, format: uri }
        index_url: { type: string, format: uri }
        official: { type: boolean }
        enabled: { type: boolean }
        etag: { type: string }
        last_modified: { type: string }
        last_refresh_error: { type: string }
        last_refreshed_at:
          $ref: '#/components/schemas/ManagementLocalTime'
        created_at:
          $ref: '#/components/schemas/ManagementLocalTime'
        updated_at:
          $ref: '#/components/schemas/ManagementLocalTime'

    PluginRepositoryCreateRequest:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 120 }
        url: { type: string, minLength: 1 }
        repository_url: { type: string, minLength: 1 }
        index_url: { type: string, minLength: 1 }
      anyOf:
        - required: [url]
        - required: [repository_url]
        - required: [index_url]
      description: url is preferred; repository_url and index_url are accepted compatibility aliases.

    PluginRepositoryListResponse:
      type: object
      additionalProperties: false
      required: [repositories]
      properties:
        repositories:
          type: array
          items:
            $ref: '#/components/schemas/PluginRepository'

    PluginMarketEntry:
      type: object
      additionalProperties: true
      required: [id, name, version, package_url, sha256, capabilities, consent_digest]
      properties:
        id: { type: string }
        name: { type: string }
        version: { type: string }
        description: { type: string }
        author: { type: string }
        homepage: { type: string, format: uri }
        icon_url: { type: string, format: uri }
        package_url: { type: string, format: uri }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        capabilities:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/PluginCapabilityDisclosure'
        account_access:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/AccountAccessMode'
        consent_digest:
          $ref: '#/components/schemas/ConsentDigest'
        tags:
          type: array
          items: { type: string }
        repository_id: { type: integer, minimum: 1 }
        repository_name: { type: string }
        repository_official: { type: boolean }
        installed_version: { type: string }
        installed_enabled: { type: boolean }

    PluginCatalogResponse:
      type: object
      additionalProperties: false
      required: [plugins]
      properties:
        plugins:
          type: array
          items:
            $ref: '#/components/schemas/PluginMarketEntry'

    PluginInstallation:
      type: object
      additionalProperties: false
      required:
        [id, plugin_id, name, version, package_url, package_sha256, capabilities,
         consent_digest, permissions_accepted_at, enabled, status, created_at, updated_at]
      properties:
        id: { type: integer, minimum: 1 }
        plugin_id: { type: string }
        name: { type: string }
        version: { type: string }
        description: { type: string }
        author: { type: string }
        homepage: { type: string, format: uri }
        icon_url: { type: string, format: uri }
        repository_id: { type: integer, minimum: 1 }
        repository_name: { type: string }
        package_url: { type: string, format: uri }
        package_sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        capabilities:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/PluginCapabilityDisclosure'
        account_access:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/AccountAccessMode'
        consent_digest:
          $ref: '#/components/schemas/ConsentDigest'
        permissions_accepted_at:
          $ref: '#/components/schemas/ManagementLocalTime'
        enabled: { type: boolean }
        status: { type: string, enum: [installed] }
        last_error: { type: string }
        created_at:
          $ref: '#/components/schemas/ManagementLocalTime'
        updated_at:
          $ref: '#/components/schemas/ManagementLocalTime'

    PluginInstallationListResponse:
      type: object
      additionalProperties: false
      required: [installations]
      properties:
        installations:
          type: array
          items:
            $ref: '#/components/schemas/PluginInstallation'

    PluginInstallationResponse:
      type: object
      additionalProperties: false
      required: [installation]
      properties:
        installation:
          $ref: '#/components/schemas/PluginInstallation'

    PluginLog:
      type: object
      additionalProperties: false
      required: [id, level, message, source, size_bytes, created_at]
      properties:
        id: { type: integer, format: int64, minimum: 1 }
        level: { type: string, enum: [debug, info, warning, error] }
        message: { type: string, maxLength: 8192 }
        fields: { type: object, additionalProperties: true }
        source: { type: string, enum: [wasm, host_api] }
        size_bytes: { type: integer, minimum: 1 }
        created_at:
          $ref: '#/components/schemas/ManagementLocalTime'

    PluginLogAppendRequest:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        level:
          type: string
          enum: [debug, info, warning, error]
          default: info
        message:
          type: string
          minLength: 1
          description: UTF-8 text limited to 8192 bytes after host sanitization.
        fields:
          type: object
          additionalProperties: true
          description: Optional JSON object limited to 8192 serialized bytes after host redaction.

    PluginLogAppendResult:
      type: object
      additionalProperties: false
      required: [log, usage]
      properties:
        log:
          $ref: '#/components/schemas/PluginLog'
        usage:
          $ref: '#/components/schemas/PluginLogUsage'

    PluginLogAppendResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/PluginLogAppendResult'
        meta:
          $ref: '#/components/schemas/ResponseMeta'

    PluginLogUsage:
      type: object
      additionalProperties: false
      required: [entries, bytes, max_entries, max_bytes, retention_days]
      properties:
        entries: { type: integer, minimum: 0 }
        bytes: { type: integer, minimum: 0 }
        max_entries: { type: integer, minimum: 1 }
        max_bytes: { type: integer, minimum: 1 }
        retention_days: { type: integer, minimum: 1 }

    PluginLogListResponse:
      type: object
      additionalProperties: false
      required: [logs, next_before_id, usage]
      properties:
        logs:
          type: array
          items: { $ref: '#/components/schemas/PluginLog' }
        next_before_id: { type: integer, format: int64, minimum: 0 }
        usage: { $ref: '#/components/schemas/PluginLogUsage' }

    PluginInstallRequest:
      type: object
      additionalProperties: false
      required: [repository_id, plugin_id, version, permissions_accepted, consent_digest]
      properties:
        repository_id: { type: integer, minimum: 1 }
        plugin_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^(?!.*\.\.)[a-z0-9](?:[a-z0-9.-]{0,126}[a-z0-9])?$'
        version:
          type: string
          pattern: '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-(?:0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(?:\.(?:0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*)?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$'
        permissions_accepted: { const: true }
        consent_digest:
          $ref: '#/components/schemas/ConsentDigest'
        enable:
          type: boolean
          default: true

    PluginOperation:
      type: object
      additionalProperties: false
      required: [id, kind, status, progress, created_at]
      properties:
        id: { type: string }
        kind: { type: string, enum: [repository_refresh, plugin_install] }
        repository_id: { type: integer, minimum: 1 }
        plugin_id: { type: string }
        installation_id: { type: integer, minimum: 1 }
        status: { type: string, enum: [queued, running, succeeded, failed] }
        progress: { type: integer, minimum: 0, maximum: 100 }
        message: { type: string }
        error: { type: string }
        created_at:
          $ref: '#/components/schemas/ManagementLocalTime'
        started_at:
          $ref: '#/components/schemas/ManagementLocalTime'
        finished_at:
          $ref: '#/components/schemas/ManagementLocalTime'

    PluginOperationResponse:
      type: object
      additionalProperties: false
      required: [operation]
      properties:
        operation:
          $ref: '#/components/schemas/PluginOperation'

    PluginRepositoryQueuedResponse:
      type: object
      additionalProperties: false
      required: [repository]
      properties:
        repository:
          $ref: '#/components/schemas/PluginRepository'
        operation:
          $ref: '#/components/schemas/PluginOperation'
        warning: { type: string }

    PluginOperationListResponse:
      type: object
      additionalProperties: false
      required: [operations]
      properties:
        operations:
          type: array
          items:
            $ref: '#/components/schemas/PluginOperation'

    PluginOperationDetailResponse:
      type: object
      additionalProperties: false
      required: [operation]
      properties:
        operation:
          $ref: '#/components/schemas/PluginOperation'
        result: {}

    PluginUninstallResponse:
      type: object
      additionalProperties: false
      required: [success, warning]
      properties:
        success: { type: boolean }
        warning: { type: string }

    PluginAccountOption:
      type: object
      additionalProperties: false
      required: [mode, name]
      properties:
        mode: { type: string, enum: [main, backup_pool, backup_ref] }
        account_ref: { type: string, pattern: '^a115_[A-Za-z0-9_-]+$' }
        name: { type: string }
        user_name: { type: string }
        is_vip: { type: boolean }
        cloud_name: { type: string }

    PluginAccountOptionListResponse:
      type: object
      additionalProperties: false
      required: [options]
      properties:
        options:
          type: array
          items:
            $ref: '#/components/schemas/PluginAccountOption'

    PluginRuntime:
      type: object
      additionalProperties: false
      required: [installation_id, runtime_kind, abi, entry, timeout_ms, loaded, health_status]
      properties:
        installation_id: { type: integer, minimum: 1 }
        runtime_kind: { type: string, const: wasm }
        abi: { type: string, const: dian115:plugin@1 }
        entry: { type: string, description: Package-relative WASM entry; never an absolute path. }
        memory_mb: { type: integer, minimum: 8, maximum: 64 }
        timeout_ms: { type: integer, minimum: 100, maximum: 30000 }
        background_timeout_ms: { type: integer, minimum: 1000, maximum: 300000 }
        max_concurrency: { type: integer, minimum: 1, maximum: 2 }
        capability_revision: { type: integer, minimum: 1 }
        loaded: { type: boolean }
        health_status: { type: string, enum: [healthy, unhealthy, unknown] }
        health_error: { type: string }
        health_checked_at: { $ref: '#/components/schemas/ManagementLocalTime' }
        created_at: { $ref: '#/components/schemas/ManagementLocalTime' }
        updated_at: { $ref: '#/components/schemas/ManagementLocalTime' }

    PluginRuntimeABI:
      type: object
      additionalProperties: false
      description: |
        In-process JSON ABI used by .d115p WASM modules. This is a logical
        contract for the supervisor, not an HTTP endpoint.
      required: [abi, exports, host_imports, request_envelope, host_request]
      properties:
        abi: { type: string, const: dian115:plugin@1 }
        exports:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [dian115_alloc, dian115_free, dian115_invoke, dian115_init, dian115_shutdown]
        host_imports:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [dian115.host_call, dian115.log]
        request_envelope:
          type: object
          additionalProperties: false
          required: [op, invocation_id]
          properties:
            op: { type: string, enum: [health, state, action, job, event] }
            invocation_id: { type: string }
            payload:
              type: object
              additionalProperties: true
              description: For op=event, contains id (equal to invocation_id), topic, occurred_at and data.
        host_request:
          type: object
          additionalProperties: false
          required: [method, path]
          properties:
            method: { type: string, enum: [GET, HEAD, POST, PUT, PATCH, DELETE] }
            path: { type: string, pattern: '^/plugin-api/v1/' }
            headers:
              type: object
              additionalProperties: { type: string }
            body_base64:
              type: string
              contentEncoding: base64

    PluginRuntimeResponse:
      type: object
      additionalProperties: false
      required: [runtime]
      properties:
        runtime:
          $ref: '#/components/schemas/PluginRuntime'

    PluginRuntimeHealthResponse:
      type: object
      additionalProperties: false
      required: [runtime, health]
      properties:
        runtime:
          $ref: '#/components/schemas/PluginRuntime'
        health:
          type: object
          additionalProperties: false
          required: [status]
          properties:
            status: { type: string, const: ok }
            version: { type: string }

    PluginRuntimeJobDeclaration:
      type: object
      additionalProperties: false
      required: [id, handler]
      properties:
        id: { type: string, pattern: '^[A-Za-z0-9]+(?:[._-][A-Za-z0-9]+)*$' }
        handler: { type: string, pattern: '^[A-Za-z0-9]+(?:[._-][A-Za-z0-9]+)*$' }
        default_schedule: { type: string, maxLength: 120 }
        allow_overlap: { type: boolean }

    PluginUICondition:
      type: object
      additionalProperties: false
      required: [source, operator, value]
      properties:
        source: { type: string, minLength: 1, maxLength: 160, pattern: '^[A-Za-z0-9]+(?:[._-][A-Za-z0-9]+)*$' }
        operator: { type: string, enum: [eq, neq, in, not_in, truthy, falsy] }
        value: {}

    PluginUICapabilityList:
      type: array
      maxItems: 16
      uniqueItems: true
      items: { $ref: '#/components/schemas/CapabilityName' }

    PluginUIDisplayField:
      type: object
      additionalProperties: false
      required: [key, label]
      properties:
        key: { type: string, minLength: 1, maxLength: 160, pattern: '^[A-Za-z0-9]+(?:[._-][A-Za-z0-9]+)*$' }
        label: { type: string, minLength: 1, maxLength: 100 }
        format: { type: string, enum: [text, number, boolean, datetime, bytes, duration, status, percent], default: text }
        visible_when: { $ref: '#/components/schemas/PluginUICondition' }

    PluginUIOption:
      type: object
      additionalProperties: false
      required: [label, value]
      properties:
