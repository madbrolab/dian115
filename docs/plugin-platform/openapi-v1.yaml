openapi: 3.1.0
info:
  title: DIAN115 Plugin Host API v2
  version: 2.1.0
  description: |
    第三方插件可直接调用的 DIAN115 宿主业务接口。

    WASM 与宿主管理的 process 插件通过 Host Call 传入 method、path、headers
    和 body_base64；宿主核对安装时批准的 METHOD + path 后分发到真实 Handler。
    本文档描述 body_base64 解码后的 HTTP 请求和响应。插件不自行连接 DIAN115
    HTTP 端口，也不提供 Authorization 或 Cookie。

    所有写操作都应携带 Idempotency-Key。订阅响应会删除 download_url 并脱敏
    Cookie、Token、API Key、passkey 和可复用 URL。
externalDocs:
  description: Plugin Host API 人工参考
  url: ./host-api-reference.md
servers:
  - url: /
    description: 逻辑地址；仅由插件 Host Call 在宿主进程内分发。
tags:
  - name: Plugin Discovery
    description: 管理员读取当前版本可声明的 Host API 目录。
  - name: Host API · 115
    description: 宿主管理凭据的 115 多账号安全操作。
  - name: Host API · Files
    description: 本地挂载与 CD2 挂载统一文件管理。
  - name: Host API · Runtime
    description: 当前插件安装实例的 KV 和目录监控。
  - name: Host API · Subscriptions
    description: 统一、聚合与 PT 订阅管理；响应由宿主脱敏。
  - name: Host API · Notifications
    description: 独立的插件通知类型。
  - name: Host API · TMDB
    description: 使用宿主 API Key、代理、缓存与限流的 TMDB 门面。
x-dian115-host-call:
  request_schema: '#/components/schemas/HostCallRequest'
  response_schema: '#/components/schemas/HostCallResponse'
  body_encoding: Base64 encoded JSON
  max_request_body_bytes: 262144
  max_response_body_bytes: 262144
  allowed_headers: [Accept, Content-Type, If-Match, If-None-Match, Idempotency-Key, X-Correlation-ID]
x-dian115-host-api-count: 58
