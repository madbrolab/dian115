            mode: { const: main }
        - type: object
          additionalProperties: false
          required: [mode]
          properties:
            mode: { const: backup_pool }
        - type: object
          additionalProperties: false
          required: [mode, account_ref]
          properties:
            mode: { const: backup_ref }
