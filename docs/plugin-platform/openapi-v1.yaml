      maxLength: 64
      pattern: '^a115_[A-Za-z0-9_-]+$'
      description: Installation-scoped opaque reference for one backup account.

    AccountSelectionRef:
      type: string
      pattern: '^asel_[A-Za-z0-9]+$'
      description: Short-lived opaque reference bound to one resolved 115 account.

    BackupAccountSummary:
      type: object
      additionalProperties: false
      required: [account_ref, name, available]
      properties:
        account_ref:
          $ref: '#/components/schemas/AccountRef'
