      minLength: 3
      maxLength: 162
      pattern: '^"[!#-~]{1,160}"$'
      description: Strong quoted entity-tag containing one raw RevisionToken value.

    EmptyResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: object
          additionalProperties: false
        meta:
          $ref: '#/components/schemas/ResponseMeta'

    CapabilityName:
      type: string
      enum:
        - network.http
        - network.proxy
        - files.local.read
        - files.local.write
        - files.cloud.read
        - files.cloud.write
        - files.watch
        - transfer.115.read
        - transfer.115.create
        - transfer.115.cancel
        - subscriptions.read
        - subscriptions.create
        - subscriptions.update
        - subscriptions.cancel
        - events.subscribe
        - scheduler.register
        - storage.kv
        - secrets.use
        - accounts.115.use
        - notifications.plugin.send

    AccountAccessMode:
      type: string
      enum: [main, backup_pool, backup_select]
      description: |
        Installation disclosure for 115 account usage. backup_select is the
        consent value that allows the runtime backup_ref selector.

    CapabilityDeclaration:
      type: object
      additionalProperties: false
      required: [capability, reason]
      properties:
        capability:
          $ref: '#/components/schemas/CapabilityName'
        reason:
          type: string
          minLength: 1
          maxLength: 240
          description: Author-provided text shown during the all-or-nothing installation consent.

    CapabilityListResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [capability_revision, items, account_access]
          properties:
            capability_revision:
              type: integer
              minimum: 1
              description: |
                Increments after installation or disclosure-changing update so
                stale tokens and WASM invocations can be rejected. It is not a
                fine-grained authorization revision.
            items:
              type: array
              uniqueItems: true
              items:
                $ref: '#/components/schemas/CapabilityDeclaration'
            account_access:
              type: array
              maxItems: 3
              uniqueItems: true
              items:
                $ref: '#/components/schemas/AccountAccessMode'
        meta:
          $ref: '#/components/schemas/ResponseMeta'

    PluginNotificationRequest:
      type: object
      additionalProperties: false
      required: [level, title, body]
      properties:
        level:
          type: string
          enum: [info, success, warning, error]
          description: Host-rendered severity of the plugin result.
        title:
          type: string
          minLength: 1
          maxLength: 160
        body:
          type: string
          minLength: 1
          maxLength: 2000
        job_ref:
          type: string
          maxLength: 128
          description: Optional opaque Host API job reference.
        dedupe_key:
          type: string
          maxLength: 200
          description: Optional installation-scoped replay key retained for ten minutes.

    PluginNotificationResult:
      type: object
      additionalProperties: false
      required: [event, accepted]
      properties:
        event:
          type: string
          const: plugin_notification_message
        accepted:
          type: boolean
        deduplicated:
          type: boolean
        suppressed:
          type: boolean
        suppression_reason:
          type: string

    PluginNotificationResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/PluginNotificationResult'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
