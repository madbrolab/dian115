        - reason
      properties:
        method:
          type: string
          enum:
            - GET
            - HEAD
            - POST
            - PUT
            - PATCH
            - DELETE
        path:
          type: string
          pattern: ^/api/
        reason:
          type: string
          minLength: 1
          maxLength: 240
    NetworkPermission:
      type: object
      additionalProperties: false
      required:
        - origin
        - methods
        - reason
      properties:
        origin:
          type: string
          format: uri
          pattern: ^https?://[^/]+$
        methods:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum:
              - GET
              - HEAD
              - POST
              - PUT
              - PATCH
              - DELETE
        proxy_mode:
          type: string
          description: Routing preference for this origin and method. A host proxy-domain match overrides direct.
          enum:
            - system
            - direct
            - required
        reason:
          type: string
          minLength: 1
          maxLength: 240
    HostCallRequest:
      type: object
      additionalProperties: false
      required:
        - method
        - path
      properties:
        method:
          type: string
          enum:
            - GET
            - HEAD
            - POST
            - PUT
            - PATCH
            - DELETE
        path:
          type: string
          description: 已登记的 /api/... 路径，或任意完整 HTTP/HTTPS URL（包括本机、容器和局域网地址）。外部地址统一由宿主 Broker 访问。
          pattern: ^(?:/api/|https?://)
        headers:
          type: object
          additionalProperties:
            type: string
        body_base64:
          type: string
        credential_ref:
          type: string
          pattern: '^cred_[A-Za-z0-9]+$'
          description: Installation-scoped hosted credential reference. Valid for external HTTP/HTTPS paths when permissions include the hosted credential capability; HTTP sends the secret without transport encryption.
    PluginNotificationRequest:
      type: object
      additionalProperties: false
      required: [level, title, body]
      properties:
        level:
          type: string
          enum: [info, success, warning, error]
        title:
          type: string
          minLength: 1
          maxLength: 160
        body:
          type: string
          minLength: 1
          maxLength: 2000
        image_url:
          type: string
          format: uri
          pattern: ^https://
        buttons:
          type: array
          maxItems: 8
          items:
            type: array
            minItems: 1
            maxItems: 4
            items:
              type: object
              additionalProperties: false
              required: [text, url]
              properties:
                text:
                  type: string
                  minLength: 1
                  maxLength: 64
                url:
                  type: string
                  format: uri
                  pattern: ^https://
        job_ref:
          type: string
        dedupe_key:
          type: string
          maxLength: 200
    HostCallResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - headers
        - body_base64
      properties:
        status:
          type: integer
          minimum: 100
          maximum: 599
        headers:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        body_base64:
          type: string
    Problem:
      type: object
      additionalProperties: true
      properties:
        error:
          type: string
        code:
          type: string
