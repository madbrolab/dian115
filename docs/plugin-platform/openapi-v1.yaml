openapi: 3.1.0
info:
  title: DIAN115 Plugin Platform API
  version: 1.0.0
  license:
    name: Terms to be defined before public SDK release
    identifier: LicenseRef-DIAN115
  description: |
    Host API contract for user-installed plugins, plus the implemented
    plugin-center management API. Third-party code is packaged in a .d115p
    archive and executed by the in-process WASM supervisor. Host routes are
    isolated from administrator routes; a WASM identity is bound automatically
    and no external service URL or runtime credential is required. Host API
    operations are invoked through dian115.host_call with an installation
    identity injected by the supervisor; plugins do not receive an HTTP token.
servers:
  - url: /plugin-api/v1
    description: Logical Host API namespace. Local WASM plugins call these operations through dian115.host_call; the path is not an outbound network URL.
tags:
  - name: Runtime
    description: In-process WASM runtime lifecycle and JSON ABI.
  - name: Capabilities
    description: Capability categories disclosed and accepted for the authenticated installation.
  - name: Accounts
    description: Opaque 115 account selection without exposing Cookies or database IDs.
  - name: Network
    description: SSRF-resistant outbound HTTP requests and system proxy policy.
  - name: Files
    description: Opaque-reference file access within roots exposed by the Host API.
  - name: Transfers
    description: Controlled 115 share receive and offline download workflows.
  - name: Subscriptions
    description: Stable facade over PT and aggregate subscription workflows.
  - name: Jobs
    description: Persistent asynchronous operation status and cancellation.
  - name: Storage
    description: Installation-scoped versioned key-value storage.
  - name: Notifications
    description: Plugin-owned task result notifications delivered through configured host channels.
  - name: Plugin Center
    description: Implemented administrator API for repositories, catalog, installations and operations.

paths:
  /capabilities:
    get:
      tags: [Capabilities]
      summary: List the capability disclosure accepted for this installation
      operationId: listCapabilities
      responses:
        '200':
          description: Accepted capability categories and 115 account access modes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilityListResponse'
        '401':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /notifications:
    post:
      tags: [Notifications]
      summary: Send a plugin task result notification
      description: |
        Queues a notification through the host's configured notification
        channels. The plugin display name is taken from the installed manifest;
        it cannot be supplied or overridden by the request. The host validates
        severity, length, HTML safety, per-plugin frequency and optional
        dedupe_key. A disabled channel or quiet period is reported as an
        explicit suppression rather than requiring an unbounded retry loop.
      operationId: sendPluginNotification
      x-dian115-capability: notifications.plugin.send
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PluginNotificationRequest'
      responses:
        '202':
          description: Notification accepted for delivery
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginNotificationResponse'
        '200':
          description: Notification was deduplicated or explicitly suppressed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginNotificationResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /logs:
    post:
      tags: [Runtime]
      summary: Append an installation-scoped plugin log record
      description: |
        Logging is available to every authenticated plugin installation and
        does not require a capability declaration. Message and serialized
        fields are each limited to 8 KiB after host sanitization. Records are
        isolated per installation and pruned to 5000 entries, 4 MiB and a
        14-day retention window.
      operationId: appendPluginLog
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PluginLogAppendRequest'
      responses:
        '202':
          description: Log accepted and persisted in the current installation namespace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginLogAppendResponse'
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /accounts/115:
    get:
      tags: [Accounts]
      summary: List 115 account selector modes available to this installation
      description: |
        The response contains only safe display metadata and installation-scoped
        opaque account references. Cookies, device credentials, database IDs and
        raw 115 CIDs are never returned.
      operationId: list115AccountOptions
      x-dian115-capability: accounts.115.use
      responses:
        '200':
          description: Available selector modes and optional backup-account summaries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account115OptionsResponse'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /accounts/115/selections:
    post:
      tags: [Accounts]
      summary: Create a short-lived 115 account selection
      description: |
        main resolves the active main account, backup_pool atomically acquires an
        enabled backup account, and backup_ref resolves an opaque reference returned
        by GET /accounts/115. The runtime selector must be covered by the manifest's
        accepted account_access disclosure.
      operationId: create115AccountSelection
      x-dian115-capability: accounts.115.use
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountSelectionRequest'
      responses:
        '201':
          description: Account selection created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountSelectionResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /network/requests:
    post:
      tags: [Network]
      summary: Perform one outbound HTTP request through the Network Broker
      operationId: createNetworkRequest
      x-dian115-capability: network.http
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NetworkRequest'
      responses:
        '200':
          description: Filtered upstream response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '502':
          $ref: '#/components/responses/Problem'
        '504':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /files/roots:
    get:
      tags: [Files]
      summary: List virtual roots exposed by the Host API
      operationId: listFileRoots
      x-dian115-capability-any-of:
        - files.local.read
        - files.local.write
        - files.cloud.read
        - files.cloud.write
      parameters:
        - $ref: '#/components/parameters/OptionalAccountSelectionRefQuery'
      responses:
        '200':
          description: |
            Host-exposed roots available for the declared file capability
            categories. A `local` root is a configured container-visible mount
            and is returned without an account selection. A `cd2` root is a
            configured path under the CD2 mount prefix; all enumeration and
            mutations for that root use the CloudDrive2 gRPC broker and it also
            has no account selection. A `115` root is created only when a valid
            account_selection_ref is supplied and the installation declares
            accounts.115.use plus the corresponding files.cloud capability.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileRootListResponse'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /files/entries:
    get:
      tags: [Files]
      summary: List entries under a root or directory reference
      operationId: listFileEntries
      x-dian115-capability-any-of:
        - files.local.read
        - files.local.write
        - files.cloud.read
        - files.cloud.write
      parameters:
        - name: root_id
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/RootId'
        - name: parent_ref
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/EntryRef'
          description: Omit to list the root entry.
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Entry page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileEntryListResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /files/entries/{entry_ref}:
    parameters:
      - $ref: '#/components/parameters/EntryRefPath'
    get:
      tags: [Files]
      summary: Read safe metadata for an entry reference
      operationId: getFileEntry
      x-dian115-capability-any-of:
        - files.local.read
        - files.local.write
        - files.cloud.read
        - files.cloud.write
      responses:
        '200':
          description: Entry metadata
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileEntryResponse'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      tags: [Files]
      summary: Rename an entry using optimistic concurrency
      operationId: renameFileEntry
      x-dian115-capability-any-of:
        - files.local.write
        - files.cloud.write
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameEntryRequest'
      responses:
        '200':
          description: Entry renamed
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileEntryResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /files/entries/{entry_ref}/content:
    get:
      tags: [Files]
      summary: Read bounded content for a file entry
      operationId: readFileEntryContent
      x-dian115-capability-any-of:
        - files.local.read
        - files.cloud.read
      parameters:
        - $ref: '#/components/parameters/EntryRefPath'
        - name: Range
          in: header
          required: false
          schema:
            type: string
            maxLength: 80
          description: A single bytes range; multi-range requests are rejected.
      responses:
        '200':
          description: Complete content
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '206':
          description: Partial content
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            ETag:
              $ref: '#/components/headers/ETag'
            Content-Range:
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '416':
          $ref: '#/components/responses/RangeNotSatisfiable'
        default:
          $ref: '#/components/responses/Problem'

  /files/directories:
    post:
      tags: [Files]
      summary: Create a child directory under an opaque parent reference
      operationId: createFileDirectory
      x-dian115-capability-any-of:
        - files.local.write
        - files.cloud.write
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDirectoryRequest'
      responses:
        '201':
          description: Directory created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileEntryResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /files/operations:
    post:
      tags: [Files]
      summary: Queue a copy or move operation
      description: |
        Pure CD2 source and destination references are executed through the
        CloudDrive2 gRPC broker. If either endpoint is a non-CD2 local path,
        the complete operation uses the container-visible local mount paths.
        The `115` backend remains limited to copy/move within the same selected
        115 account and root.
      operationId: createFileOperation
      x-dian115-capability-any-of:
        - files.local.write
        - files.cloud.write
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FileOperationRequest'
      responses:
        '202':
          description: Job persisted and queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAcceptedResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /files/watches:
    get:
      tags: [Files]
      summary: List this installation's durable directory watches
      operationId: listFileWatches
      x-dian115-capability: files.watch
      responses:
        '200':
          description: Installation-scoped watch definitions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileWatchListResponse'
        default:
          $ref: '#/components/responses/Problem'
    post:
      tags: [Files]
      summary: Create a durable directory watch from an opaque directory entry reference
      description: The directory_ref must be an existing opaque File Broker root or directory reference owned by this installation. Host paths and CD2 credentials are never accepted or exposed.
      operationId: createFileWatch
      x-dian115-capability: files.watch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FileWatchCreateRequest'
      responses:
        '201':
          description: Watch created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileWatchResponse'
        default:
          $ref: '#/components/responses/Problem'

  /files/watches/{watch_ref}:
    delete:
      tags: [Files]
      summary: Delete one installation-scoped directory watch
      operationId: deleteFileWatch
      x-dian115-capability: files.watch
      parameters:
        - name: watch_ref
          in: path
          required: true
          schema:
            type: string
            pattern: '^fw_[A-Za-z0-9_-]+$'
      responses:
        '200':
          description: Watch deleted
        default:
          $ref: '#/components/responses/Problem'

  /transfers/115/targets:
    get:
      tags: [Transfers]
      summary: List opaque 115 target references
      operationId: list115TransferTargets
      x-dian115-capability-any-of: [transfer.115.read, transfer.115.create]
      parameters:
        - name: operation
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/TransferOperation'
        - $ref: '#/components/parameters/AccountSelectionRefQuery'
      responses:
        '200':
          description: Host-exposed targets bound to the selected account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferTargetListResponse'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    post:
      tags: [Transfers]
      summary: Convert a browsed cloud directory entry into an opaque 115 transfer target
      description: |
        The entry_ref must identify a current cloud directory returned by the File
        Broker for the same installation and a still-live account selection. This
        allows a plugin to browse beyond configured default targets without ever
        receiving the underlying 115 CID. Cloud root CID 0 and file entries are rejected.
      operationId: create115TransferTargetFromEntry
      x-dian115-capability: transfer.115.create
      x-dian115-capability-any-of: [files.cloud.read, files.cloud.write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferTargetCreateRequest'
      responses:
        '201':
          description: Transfer target created from the selected cloud directory
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferTargetResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /transfers/115/share-previews:
    post:
      tags: [Transfers]
      summary: Create a short-lived preview for an official 115 share URL
      operationId: create115SharePreview
      x-dian115-capability-any-of: [transfer.115.read, transfer.115.create]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SharePreviewRequest'
      responses:
        '201':
          description: Preview created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharePreviewResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '502':
          $ref: '#/components/responses/Problem'
        '504':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /transfers/115/share-previews/{preview_ref}/items:
    get:
      tags: [Transfers]
      summary: List opaque selectable items in a share preview
      operationId: list115SharePreviewItems
      x-dian115-capability-any-of: [transfer.115.read, transfer.115.create]
      parameters:
        - $ref: '#/components/parameters/PreviewRefPath'
        - name: parent_ref
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ShareItemRef'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Preview item page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareItemListResponse'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '410':
          $ref: '#/components/responses/Problem'
        '502':
          $ref: '#/components/responses/Problem'
        '504':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /transfers/115/share-receives:
    post:
      tags: [Transfers]
      summary: Persist and queue a selected 115 share receive job
      operationId: create115ShareReceive
      x-dian115-capability: transfer.115.create
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShareReceiveRequest'
      responses:
        '202':
          description: Job persisted before any 115 side effect
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAcceptedResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '410':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /transfers/115/offline-downloads:
    post:
      tags: [Transfers]
      summary: Persist and queue one single-attempt offline download job
      operationId: create115OfflineDownload
      x-dian115-capability: transfer.115.create
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OfflineDownloadRequest'
      responses:
        '202':
          description: Job persisted before any 115 side effect
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAcceptedResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /transfers/115/offline-tasks:
    get:
      tags: [Transfers]
      summary: List safe 115 offline task summaries
      operationId: list115OfflineTasks
      x-dian115-capability: transfer.115.read
      parameters:
        - $ref: '#/components/parameters/AccountSelectionRefQuery'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Offline task page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfflineTaskListResponse'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '502':
          $ref: '#/components/responses/Problem'
        '504':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /transfers/115/offline-quota:
    get:
      tags: [Transfers]
      summary: Read safe offline quota information
      operationId: get115OfflineQuota
      x-dian115-capability: transfer.115.read
      parameters:
        - $ref: '#/components/parameters/AccountSelectionRefQuery'
      responses:
        '200':
          description: Offline quota
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfflineQuotaResponse'
        '401':
