      properties:
        account_selection_ref:
          $ref: '#/components/schemas/AccountSelectionRef'
        requested_mode:
          $ref: '#/components/schemas/AccountSelectorMode'
        display_name:
          type: string
          maxLength: 120
        expires_at:
          type: string
          format: date-time

    AccountSelectionResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/AccountSelection'
        meta:
          $ref: '#/components/schemas/ResponseMeta'

    OutboundRequestHeaders:
      type: object
      maxProperties: 64
      description: |
        Caller-supplied HTTP headers. Names must use lowercase ASCII token form so
        the denylist is unambiguous; credential and connection/framing headers are
        rejected rather than normalized. The host may apply a stricter policy.
      propertyNames:
        type: string
        minLength: 1
        maxLength: 64
        pattern: '^[!#$%&''*+.^_`|~0-9a-z-]+$'
        not:
          enum:
            - host
            - cookie
            - authorization
            - proxy-authorization
            - connection
            - keep-alive
            - proxy-connection
            - transfer-encoding
            - te
            - trailer
            - upgrade
            - content-length
            - expect
      additionalProperties:
        type: string
        maxLength: 8192
        pattern: '^[^\r\n]*$'

    EncodedBody:
      oneOf:
        - type: object
          additionalProperties: false
          required: [encoding, data]
          properties:
            encoding:
              const: utf8
            data:
              type: string
              maxLength: 2097152
        - type: object
          additionalProperties: false
          required: [encoding, data]
          properties:
            encoding:
              const: json
            data: {}
        - type: object
          additionalProperties: false
          required: [encoding, data]
          properties:
            encoding:
              const: base64
            data:
              type: string
              contentEncoding: base64
              contentMediaType: application/octet-stream
              maxLength: 2796204
      description: Serialized decoded data is subject to endpoint and system-level byte limits.

    NetworkRequest:
      type: object
      additionalProperties: false
      required: [method, url]
      properties:
        method:
          type: string
          enum: [GET, HEAD, POST, PUT, PATCH, DELETE]
        url:
          type: string
          format: uri
          minLength: 9
          maxLength: 4096
          pattern: '^https://(?![^/?#]*@)[^/?#]+(?:[/?][^#]*)?$'
          description: Absolute lowercase-https URL without userinfo or fragment; every redirect is revalidated.
        headers:
          $ref: '#/components/schemas/OutboundRequestHeaders'
        body:
          $ref: '#/components/schemas/EncodedBody'
          x-dian115-max-decoded-bytes: 1048576
        credential_ref:
          $ref: '#/components/schemas/CredentialRef'
          description: |
            Optional installation-scoped credential binding. Using it also requires
            secrets.use. The host verifies the user-configured destination, method,
            canonical path prefix and injection rule for that credential binding.
        timeout_ms:
          type: integer
          minimum: 100
          maximum: 30000
          default: 10000
        max_response_bytes:
          type: integer
          minimum: 1
          maximum: 2097152
          default: 262144
        redirects:
          type: integer
          minimum: 0
          maximum: 3
          default: 3
        proxy_mode:
          type: string
          enum: [system, direct, required]
          default: system
          description: required needs network.proxy; direct remains subject to the system network policy.

    NetworkResult:
      type: object
      additionalProperties: false
      required: [status, final_url, headers, body, truncated, duration_ms, proxy_used]
      properties:
        status:
          type: integer
          minimum: 100
          maximum: 599
        final_url:
          type: string
          format: uri
          description: Sanitized final URL; protected query values and userinfo are removed.
        headers:
          type: object
          description: Filtered response headers; credential-bearing and redirect headers are omitted.
          additionalProperties:
            type: array
            items:
              type: string
        body:
          $ref: '#/components/schemas/EncodedBody'
          description: Bounded body. Exact reflected credential bytes cause credential_reflected instead.
        truncated:
          type: boolean
        duration_ms:
          type: integer
          minimum: 0
        proxy_used:
          type: boolean

    NetworkResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/NetworkResult'
        meta:
          $ref: '#/components/schemas/ResponseMeta'

    RootId:
      type: string
      pattern: '^root_[A-Za-z0-9]+$'
    EntryRef:
      type: string
      pattern: '^fe_[A-Za-z0-9]+$'
    TargetRef:
      type: string
      pattern: '^trg_[A-Za-z0-9]+$'
    PreviewRef:
      type: string
      pattern: '^spv_[A-Za-z0-9]+$'
    ShareItemRef:
      type: string
      pattern: '^si_[A-Za-z0-9]+$'
    JobRef:
      type: string
      pattern: '^job_[A-Za-z0-9]+$'
    SubscriptionRef:
      type: string
      pattern: '^sub_[A-Za-z0-9]+$'
    CredentialRef:
      type: string
      pattern: '^cred_[A-Za-z0-9]+$'

    FileRoot:
      type: object
      additionalProperties: false
      required: [root_id, alias, root_entry_ref, name, backend, capabilities]
      description: |
        `backend=local` identifies a configured local mount and uses the local
        filesystem. `backend=cd2` identifies a configured CD2 mount prefix and
        uses CloudDrive2 gRPC. `backend=115` identifies a dynamic root bound to
        the short-lived account_selection_ref returned by the Accounts API.
      properties:
        root_id:
          $ref: '#/components/schemas/RootId'
        alias:
          type: string
          maxLength: 80
          description: Stable Host API label; it is not a per-plugin authorization boundary.
        root_entry_ref:
          $ref: '#/components/schemas/EntryRef'
        name:
          type: string
          maxLength: 100
        backend:
          type: string
          enum: [local, cd2, '115']
          description: |
            local = container-visible local mount; cd2 = CD2 mount path routed
            through CloudDrive2 gRPC; 115 = selected 115 account cloud root.
        capabilities:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [files.local.read, files.local.write, files.cloud.read, files.cloud.write]
        account_selection_ref:
          anyOf:
            - $ref: '#/components/schemas/AccountSelectionRef'
            - type: 'null'
          description: Required and non-null for backend=115; always null for backend=local or backend=cd2.
        quota_bytes:
          type: [integer, 'null']
          minimum: 0
        used_bytes:
          type: [integer, 'null']
          minimum: 0
      allOf:
        - if:
            properties:
              backend:
                const: '115'
            required: [backend]
          then:
            required: [account_selection_ref]
            properties:
              account_selection_ref:
                $ref: '#/components/schemas/AccountSelectionRef'
              capabilities:
                items:
                  enum: [files.cloud.read, files.cloud.write]
        - if:
            properties:
              backend:
                const: local
            required: [backend]
          then:
            required: [account_selection_ref]
            properties:
              account_selection_ref:
                const: null
              capabilities:
                items:
                  enum:
                    - files.local.read
                    - files.local.write
        - if:
            properties:
              backend:
                const: cd2
            required: [backend]
          then:
            required: [account_selection_ref]
            properties:
              account_selection_ref:
                const: null
              capabilities:
                items:
                  enum: [files.cloud.read, files.cloud.write]

    FileEntry:
      type: object
      additionalProperties: false
      required: [entry_ref, root_id, name, display_path, kind, size, modified_at, revision]
