      x-dian115-in-process-only: true
      x-dian115-host-call-example:
        method: GET
        path: /api/115/accounts/options
        headers: {}
        body_base64: ''
      responses:
        '200':
          $ref: '#/components/responses/AccountOptions'
        '500':
          $ref: '#/components/responses/BusinessError'

