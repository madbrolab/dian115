        meta:
          $ref: '#/components/schemas/ResponseMeta'

    ProblemCode:
      type: string
      enum:
        - invalid_request
        - unauthorized
        - token_expired
        - token_stale
        - capability_denied
        - idempotency_key_required
        - idempotency_conflict
        - rate_limited
        - quota_exceeded
        - credential_reflected
        - resource_not_found
        - conflict
        - precondition_failed
        - preview_expired
        - range_not_satisfiable
        - upstream_unavailable
        - submission_uncertain
        - account_context_mismatch
        - account_selection_expired
        - account_unavailable
        - internal_error

    OperationErrorCode:
      description: |
        Stable core error code, or a namespaced extension code. Clients must handle
        unknown extension values without branching on the human-readable message.
      oneOf:
        - $ref: '#/components/schemas/ProblemCode'
        - type: string
          minLength: 7
          maxLength: 80
          pattern: '^ext\.[a-z0-9]+(?:[._-][a-z0-9]+)+$'

    JobError:
      type: object
      additionalProperties: false
      required: [code, message, retryable]
      properties:
        code:
          $ref: '#/components/schemas/OperationErrorCode'
        message:
          type: string
          maxLength: 2000
        retryable:
          type: boolean

    Job:
      type: object
      additionalProperties: false
      required: [job_ref, kind, status, progress, cancellable, created_at]
      properties:
        job_ref:
          $ref: '#/components/schemas/JobRef'
        kind:
          type: string
          maxLength: 100
        status:
          type: string
          enum: [queued, running, succeeded, partial, failed, cancelled, attention_required]
        progress:
          type: number
          minimum: 0
          maximum: 1
        result:
          anyOf:
            - $ref: '#/components/schemas/JobResult'
            - type: 'null'
        error:
          anyOf:
            - $ref: '#/components/schemas/JobError'
            - type: 'null'
        cancellable:
          type: boolean
        created_at:
          type: string
          format: date-time
        started_at:
          type: [string, 'null']
          format: date-time
        finished_at:
          type: [string, 'null']
          format: date-time

    JobResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/Job'
        meta:
          $ref: '#/components/schemas/ResponseMeta'

    JobResult:
      oneOf:
        - $ref: '#/components/schemas/FileOperationJobResult'
        - $ref: '#/components/schemas/ShareReceiveJobResult'
        - $ref: '#/components/schemas/OfflineDownloadJobResult'
        - $ref: '#/components/schemas/SubscriptionJobResult'

    FileOperationJobResult:
      type: object
      additionalProperties: false
      required: [type, operation, completed_count, failed_count, items]
      description: completed_count and failed_count must match the item statuses.
      properties:
        type:
          const: file_operation
        operation:
          type: string
          enum: [copy, move]
        completed_count:
          type: integer
          minimum: 0
        failed_count:
          type: integer
          minimum: 0
        items:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/FileOperationItemResult'

    FileOperationItemResult:
      oneOf:
        - type: object
          additionalProperties: false
          required: [source_ref, status, destination_ref]
          properties:
            source_ref:
              $ref: '#/components/schemas/EntryRef'
            status:
              const: succeeded
            destination_ref:
              $ref: '#/components/schemas/EntryRef'
        - type: object
          additionalProperties: false
          required: [source_ref, status, error_code]
          properties:
            source_ref:
              $ref: '#/components/schemas/EntryRef'
            status:
              const: failed
            error_code:
              $ref: '#/components/schemas/OperationErrorCode'

    ShareReceiveJobResult:
      type: object
      additionalProperties: false
      required: [type, target_ref, accepted_count]
      properties:
        type:
          const: share_receive
        target_ref:
          $ref: '#/components/schemas/TargetRef'
        accepted_count:
          type: integer
          minimum: 0

    OfflineDownloadJobResult:
      type: object
      additionalProperties: false
      required: [type, target_ref, submitted_count]
      properties:
        type:
          const: offline_download
        target_ref:
          $ref: '#/components/schemas/TargetRef'
        submitted_count:
          type: integer
          minimum: 0

    SubscriptionJobResult:
      type: object
      additionalProperties: false
      required: [type, subscription_ref]
      properties:
        type:
          type: string
          enum: [subscription_created, subscription_deleted, subscription_search_submitted]
        subscription_ref:
          $ref: '#/components/schemas/SubscriptionRef'
        initial_search_submitted:
          type: boolean

    SubscriptionEngine:
      type: string
      enum: [pt, aggregate]
    SubscriptionState:
      type: string
      enum: [pending, searching, transferring, waiting, verifying, partial, needs_attention, failed, expired]
      description: |
        Public union of active PT and aggregate states. Completion or deletion is
        represented by the corresponding job/event and subsequent GET returns 404.
    MediaType:
      type: string
      enum: [movie, tv]

    MediaInput:
      oneOf:
        - type: object
          additionalProperties: false
          required: [tmdb_id, media_type]
          properties:
            tmdb_id:
              type: integer
              minimum: 1
            media_type:
              const: movie
            season:
              type: integer
              const: 0
              default: 0
        - type: object
          additionalProperties: false
          required: [tmdb_id, media_type]
          properties:
            tmdb_id:
              type: integer
              minimum: 1
            media_type:
              const: tv
            season:
              type: integer
              minimum: 0
              default: 1

    MediaSummary:
      type: object
      additionalProperties: false
      required: [tmdb_id, media_type, season, title]
      properties:
        tmdb_id:
          type: integer
        media_type:
          $ref: '#/components/schemas/MediaType'
        season:
          type: integer
          minimum: 0
        title:
          type: string
          maxLength: 500
        year:
          type: string
          maxLength: 16
        poster_path:
          type: string
          maxLength: 500

    AggregateSubscriptionOptions:
      type: object
      additionalProperties: false
      required: [enabled_sources, profile_ref]
      properties:
        enabled_sources:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum: [dianying, pt, tg]
        total_episodes:
          type: integer
          minimum: 0
          maximum: 10000
        needed_episodes:
          type: string
          minLength: 1
          maxLength: 2000
          pattern: '^(?:all|[0-9]+(?:-[0-9]+)?(?:\s*,\s*[0-9]+(?:-[0-9]+)?)*)$'
          description: Compact episode set; semantic expansion is capped at 10000.
        profile_ref:
          type: string
          pattern: '^sprof_[A-Za-z0-9]+$'

    PTSubscriptionOptions:
      type: object
      additionalProperties: false
      required: [profile_ref]
      properties:
        profile_ref:
          type: string
          pattern: '^sprof_[A-Za-z0-9]+$'
        needed_episodes:
          type: string
          minLength: 1
          maxLength: 2000
          pattern: '^(?:all|[0-9]+(?:-[0-9]+)?(?:\s*,\s*[0-9]+(?:-[0-9]+)?)*)$'
          description: Compact episode set; semantic expansion is capped at 10000.

    SubscriptionCreateRequest:
      oneOf:
        - type: object
          additionalProperties: false
          required: [engine, media, options]
          properties:
            engine:
              const: aggregate
            media:
              $ref: '#/components/schemas/MediaInput'
            options:
              $ref: '#/components/schemas/AggregateSubscriptionOptions'
            metadata:
              $ref: '#/components/schemas/RequestMetadata'
        - type: object
          additionalProperties: false
          required: [engine, media, options]
          properties:
            engine:
              const: pt
            media:
              $ref: '#/components/schemas/MediaInput'
            options:
              $ref: '#/components/schemas/PTSubscriptionOptions'
            metadata:
              $ref: '#/components/schemas/RequestMetadata'

    EpisodeUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        total_episodes:
          type: integer
          minimum: 0
          maximum: 10000
        needed_episodes:
          type: string
          minLength: 1
          maxLength: 2000
          pattern: '^(?:all|[0-9]+(?:-[0-9]+)?(?:\s*,\s*[0-9]+(?:-[0-9]+)?)*)$'
          description: Compact episode set; semantic expansion is capped at 10000.

    SubscriptionProfile:
      type: object
      additionalProperties: false
      required: [profile_ref, alias, engine, name]
      properties:
        profile_ref:
          type: string
          pattern: '^sprof_[A-Za-z0-9]+$'
        alias:
          type: string
          maxLength: 80
          description: Stable Host API label for a user-configured subscription profile.
        engine:
          $ref: '#/components/schemas/SubscriptionEngine'
        name:
          type: string
          maxLength: 120
        media_types:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/MediaType'

    SubscriptionProfileListResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/SubscriptionProfile'
        meta:
          $ref: '#/components/schemas/ResponseMeta'

    CreatedBySummary:
      type: object
      additionalProperties: false
      required: [source, this_installation]
      properties:
        source:
          type: string
          enum: [plugin, user, system]
        this_installation:
          type: boolean
        display_name:
          type: string
          maxLength: 120

    Subscription:
      type: object
      additionalProperties: false
      required: [subscription_ref, engine, state, revision, created_by, media, created_at, updated_at]
      properties:
        subscription_ref:
          $ref: '#/components/schemas/SubscriptionRef'
        engine:
          $ref: '#/components/schemas/SubscriptionEngine'
        state:
          $ref: '#/components/schemas/SubscriptionState'
        revision:
          $ref: '#/components/schemas/RevisionToken'
        created_by:
          $ref: '#/components/schemas/CreatedBySummary'
        media:
          $ref: '#/components/schemas/MediaSummary'
        total_episodes:
          type: integer
          minimum: 0
        needed_episodes:
          type: string
        covered_episodes:
          type: string
        last_error:
          type: string
          maxLength: 2000
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    SubscriptionResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/Subscription'
        meta:
          $ref: '#/components/schemas/ResponseMeta'

    SubscriptionListResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Subscription'
            next_cursor:
              type: [string, 'null']
        meta:
          $ref: '#/components/schemas/ResponseMeta'

    StorageValue:
      type: object
      additionalProperties: false
      required: [key, value, revision, updated_at]
      properties:
        key:
          type: string
        value: {}
        revision:
          $ref: '#/components/schemas/RevisionToken'
        updated_at:
          type: string
          format: date-time

    StorageResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/StorageValue'
        meta:
          $ref: '#/components/schemas/ResponseMeta'

    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, code, detail, request_id, retryable]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          $ref: '#/components/schemas/ProblemCode'
        detail:
          type: string
        request_id:
          type: string
        retryable:
          type: boolean
        retry_after_ms:
          type: integer
          minimum: 0
        details:
          type: object
          additionalProperties: true

    RangeNotSatisfiableProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            status: { const: 416 }
            code: { const: range_not_satisfiable }
